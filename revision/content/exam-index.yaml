# Index of every question of the past exams (SPEC §8.3), built in S3 (2026-10-02) from the solution PDFs.
# One entry per question: exam (final-YYYY | mock-YYYY), q (number as printed; mock bullets 5a, 5b, … in order),
# type (mcq | tf | open), topic, areas (course areas it needs), lectures (only when every area is a lecture
# already in course.yaml), status, page (1-based page of the question in the *solutions* PDF).
# status: pending = to add as a card once all its lectures are active · added = card exists (id exam-YYYY-qNN /
#         mock-YYYY-qN[x]) · open-excluded = open/derivation question (out of scope for now) ·
#         excluded = not in the 2026 syllabus (Bayes nets / factor graphs).
# figure: true = the question needs a figure (crop it into content/img/). multi: true = "select all that apply".
# Areas of later lectures (classification, svm, knn, kernels, neural-nets, cnn, transformers, …) get their lecture ids
# when those lectures are caught up: then fill `lectures` and the questions become pending-unlockable.
# Mock midterms 2014/2015 and the derivation parts of 2017/2018 are open (no auto-gradable part).
# Exponential-family questions are filed under logistic-regression + mle (GLMs; check against lecture 05 when it arrives).
areas:
  math: prerequisite linear algebra / calculus / probability (→ 01a)
  ml-basics: 01a
  linear-regression: 01b
  loss-functions: 01c
  optimization: 02a (GD, SGD, convexity, subgradients)
  least-squares: 03a
  overfitting: 03b
  mle: 03c
  regularization: 03d (ridge, lasso)
  generalization: 04a (risk, Hoeffding, CV, model selection)
  bias-variance: 04b
  classification: week 5
  logistic-regression: week 5 (incl. exponential family / GLM)
  svm: week 6
  knn: week 6
  kernels: week 8
  neural-nets: weeks 8–9
  cnn: week 9
  transformers: week 10
  adversarial: week 10
  fairness: week 11
  kmeans: week 11
  gmm-em: weeks 11–12
  matrix-factorization: week 12 (incl. PCA / SVD)
  text-representation: week 13
  llm: weeks 13–14
  self-supervised: week 14
  generative: week 14 (GANs, diffusion)
  bayes-nets: not in the 2026 syllabus
