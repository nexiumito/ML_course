  added: 2026-10-02

- id: exam-2021-q4
  type: mcq
  origin: exam_official
  lecture: "04b"
  themes: [bias-variance]
  priority: core
  front: |
    *(Bias-Variance Decomposition)* Consider a regression model where data $(x, y)$ is generated by input $x$ uniformly randomly sampled from $[0, 1]$
    and $y(x) = x^2 + \varepsilon$, where $\varepsilon$ is random noise with mean 0 and variance 1. Two models are carried out for regression: model A is a
    trained quadratic function $g(x; \mathbf{w}) = w_2x^2 + w_1x + w_0$ where $\mathbf{w} = (w_0, w_1, w_2)^\top \in \mathbb{R}^3$, and model B is a constant
    function $h(x) = 1/2$. Then compared to model B, model A has
  choices: ["higher bias, higher variance.", "lower bias, higher variance.", "higher bias, lower variance.", "lower bias, lower variance."]
  answer: [1]
  explanation: |
    Official solution: model B has **zero variance** because it outputs the constant $1/2$, unrelated to the training data — so A cannot have lower
    variance. A contains the true function $x^2$ (realizable, essentially zero bias) whereas the constant $1/2$ is biased.
  sources:
    - {kind: exam, pdf: exam/final-exam-2021-solutions.pdf, page: 3, label: "Final 2021 Q4"}
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 22, label: "04b p. 22"}
  added: 2026-10-02

- id: exam-2021-q26
  type: tf
  origin: exam_official
  lecture: "04b"
  themes: [bias-variance, overfitting]
  priority: core
  front: |
    *(Bias/Variance Decomposition)* Consider a linear regression model where the data is generated by input $\mathbf{x}$ and output
    $y = \mathbf{w}^\top\mathbf{x} + \varepsilon$, where $\mathbf{w}$ is a fixed vector and $\varepsilon$ is a Gaussian noise with zero mean and $\sigma^2$ variance.
    Then there is no machine learning algorithm that can achieve a training error lower than $\sigma^2$.
  answer: false
  explanation: |
    Official solution: it is the **true** error that cannot be less than $\sigma^2$ (noise term), not the training error. Overfitting is always
    an option: it is often possible to get a small (even zero) training error.
  trap: "σ² lower-bounds the true error, not the training error."
  sources:
    - {kind: exam, pdf: exam/final-exam-2021-solutions.pdf, page: 14, label: "Final 2021 Q26"}
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 23, label: "04b p. 23"}
  added: 2026-10-02

- id: exam-2016-q8
  type: mcq
  origin: exam_official
  lecture: "04b"
  themes: [bias-variance]
  priority: core
  front: |
    Consider a learning algorithm that has the property that it depends only very weakly on the input data. E.g., this could be SGD where we choose
    a very small step size and only run for very few iterations. To go to the extreme, you can imagine a learning algorithm that always outputs the
    same model irrespective of the training set. Presumably such a learning algorithm will not give us good results. Why is that?
    *(More than one answer can be correct.)*
  choices:
    - "Such a learning algorithm typically has a much larger generalization error than training error."
    - "Such a learning algorithm typically has a large bias."
    - "Such a learning algorithm is prone to overfitting."
  answer: [1]
  multi: true
  shuffle: false
  explanation: |
    Official solution: (b). The model barely depends on the training data, so it is unlikely to model it well: large bias (and near-zero variance).
    It **under**fits — training and generalization errors are both high and similar, so (a) and (c) are wrong.
  sources:
    - {kind: exam, pdf: exam/final-exam-2016-solutions.pdf, page: 3, label: "Final 2016 Q8"}
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 11, label: "04b p. 11"}
  added: 2026-10-02

