- id: mock-2018-q5j
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [convexity]
  priority: core
  front: "The following functions are convex: *(More than one answer can be correct.)*"
  choices:
    - "$f(x) := x^2$, $x \\in \\mathbb{R}$"
    - "$f(x) := x^3$, $x \\in [-1, 1]$"
    - "$f(x) := -x^3$, $x \\in [-1, 0]$"
    - "$f(x) := e^{-x}$, $x \\in \\mathbb{R}$"
    - "$f(x) := e^{-x^2/2}$, $x \\in \\mathbb{R}$"
    - "$f(x) := \\ln(1/x)$, $x \\in (0, \\infty)$"
    - "$f(x) := g(h(x))$, $x \\in \\mathbb{R}$, where $g, h$ are convex and increasing over $\\mathbb{R}$"
  answer: [0, 2, 3, 5, 6]
  multi: true
  shuffle: false
  explanation: |
    Official solution: 1, 3, 4, 6 and 7. Check with $f''$: $x^3$ has $f'' = 6x < 0$ on $[-1, 0)$ (not convex on $[-1,1]$); $-x^3$ has $f'' = -6x \ge 0$ on $[-1, 0]$;
    $e^{-x^2/2}$ (Gaussian bump) is concave near 0; $\ln(1/x) = -\ln x$ has $f'' = 1/x^2 > 0$; $g \circ h$ with $g$ convex increasing and $h$ convex is convex.
  sources:
    - {kind: exam, pdf: exam/mock-midterm-exam/mock-exam-2018-solutions.pdf, page: 7, label: "Mock midterm 2018, MC item 5j"}
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions.pdf, page: 11, label: "01c slide 11"}
