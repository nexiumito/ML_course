- id: exam-2018-q10
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [subgradients]
  priority: core
  front: "Mark all $x$-values for which the shown function $f(x)$ has a subgradient?"
  images:
    - {src: img/exam-2018-q10.png, alt: "Piecewise-linear function on [-2, 4]: rises with slope 2 from (-2,-5) to (0,-1), decreases to (1,-2), flat until (2,-2), then rises with slope 2 to (4,2)."}
  choices: ["1", "0", "2", "3", "−1"]
  answer: [2, 3]
  multi: true
  explanation: |
    Official solution: only at $x = 2$ and $x = 3$ (e.g. $g = 2$ works at both). A subgradient needs a line through $(x, f(x))$ lying **below the whole graph**.
    At $x = 0$ (peak) and $x = 1$ (concave kink) no such line exists; at $x = -1$ the line of slope 2 passes above the graph further right.
  trap: "Subgradient = global lower bound, not a local tangent."
  sources:
    - {kind: exam, pdf: exam/final-exam-2018-solutions.pdf, page: 11, label: "Final 2018 P10"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 32, label: "02a slide 32 (annotated)"}
  added: 2026-10-02
  notes: "Checked by hand 2026-10-02: at x=-1 the slope-2 line exceeds f at x=1; at x=1 a line must have g<=0 (right) and g>=1 (left)."

