- id: exam-2025-q5
  type: mcq
  origin: exam_official
  lecture: "02a"
  also_lectures: ["01b"]
  themes: [gradient-descent, linear-regression]
  priority: core
  front: |
    *(Gradient of Linear MSE)* Consider a linear regression model $y = Xw$, with the mean squared error loss function:
    $L(w) = \frac{1}{2N}\sum_{n=1}^N (y_n - x_n^\top w)^2$. Which of the following expressions correctly represents the gradient of $L(w)$ with respect to $w$?
  choices: ["$\\frac1N X(y - Xw)$", "$\\frac1N X^\\top(y - Xw)$", "$-\\frac1N X^\\top(y - Xw)$", "$X^\\top Xw - X^\\top y$"]
  answer: [2]
  explanation: |
    $\nabla L(w) = -\frac1N X^\top(y - Xw)$ (lecture 02a slide 15): the chain rule brings the factor $-x_n$. The first option has the wrong shape
    ($X$ instead of $X^\top$), the second the wrong sign, the last is missing the $\frac1N$.
    Note: the official solution text says "(b)", but the box ticked in the official solution is this one ($-\frac1N X^\top(y-Xw)$), which matches the lecture.
  trap: "Minus sign and transpose."
  sources:
    - {kind: exam, pdf: exam/final-exam-2025-solutions.pdf, page: 4, label: "Final 2025 Q5"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 16, label: "02a slide 15 (annotated)"}
  added: 2026-10-02
  notes: "Solution text says (b) but the ticked box is the 3rd option; the 3rd option is mathematically correct (checked 2026-10-02)."

- id: exam-2025-q6
  type: mcq
  origin: exam_official
  lecture: "02a"
  also_lectures: ["01b"]
  themes: [optimization, linear-regression]
  priority: core
  front: |
    *(Computational Complexity of the Hessian)* Consider a linear regression problem with $N$ training samples and $D$ parameters, and the
    mean squared error loss $L(w) = \frac{1}{2N}\sum_{n=1}^N (y_n - x_n^\top w)^2$. The Hessian matrix $\nabla^2 L(w)$ contains all second derivatives of $L(w)$
    with respect to the parameters. What is the computational complexity (in big-O notation) of computing the Hessian matrix using standard matrix multiplication?
  choices: ["$O(ND)$", "$O(ND^2)$", "$O(N^2D)$", "$O(D^2)$"]
  answer: [1]
  explanation: |
    Official solution: $\nabla^2 L(w) = \frac1N\sum_n x_nx_n^\top = \frac1N X^\top X$, a $D\times D$ matrix; each of its $O(D^2)$ entries is a sum over $N$
    samples ⇒ $O(ND^2)$. $O(ND)$ is the cost of one gradient; $O(D^2)$ only counts the entries.
  sources:
    - {kind: exam, pdf: exam/final-exam-2025-solutions.pdf, page: 4, label: "Final 2025 Q6"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 39, label: "02a slide 39 (annotated)"}
  added: 2026-10-02

