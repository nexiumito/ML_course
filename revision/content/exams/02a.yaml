- id: exam-2019-q19
  type: tf
  origin: exam_official
  lecture: "02a"
  themes: [convexity]
  priority: core
  front: "*(Convex III)* Let $f, g : \\mathbb{R} \\to \\mathbb{R}$ be two convex functions. Then $h = f \\circ g$ is always convex."
  answer: false
  explanation: |
    Official solution: $h'' = f''(g)\,(g')^2 + f'(g)\,g''$; if $f' < 0$ (decreasing outer function) and large, the second term can make $h''$ negative.
    Example: $f(x) = -x$ is convex, $g(x) = x^2$ convex, but $f \circ g = -x^2$ is concave. Convexity is guaranteed when $f$ is convex **and increasing**.
  sources:
    - {kind: exam, pdf: exam/final-exam-2019-solutions.pdf, page: 9, label: "Final 2019 Q19"}
  added: 2026-10-02

