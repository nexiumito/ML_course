- id: exam-2021-q6
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [optimization]
  priority: detail
  front: |
    Which of the following functions reaches a global maximum on the set $I$? (Note that $[.,.]$ and $(.,.)$ denote closed and open intervals respectively)

    - $f_1(x) = -x^4$, $I = [-5, 5]$
    - $f_2(x) = \arccos(x)$, $I = (-1, 1)$
    - $f_3(x) = x\exp(-x)$, $I = (-\infty, 0)$
    - $f_4(x) = \sin(\cos(x))\sin(x)$, $I = \mathbb{R}_+$
  choices: ["$f_1, f_4$", "$f_1, f_3, f_4$", "$f_1, f_2, f_3, f_4$", "$f_1, f_2, f_4$"]
  answer: [0]
  explanation: |
    Official solution: $f_1$ yes (maximum at $x = 0$; continuous on a compact set). $f_2$ no: $\arccos$ is strictly decreasing, its supremum is at the
    excluded endpoint $-1$. $f_3$ no: $f_3'(x) = e^{-x}(1-x) > 0$ on $(-\infty, 0)$, increasing towards the excluded $0$. $f_4$ yes: it is periodic,
    so it attains its maximum (infinitely many times) on $\mathbb{R}_+$.
  sources:
    - {kind: exam, pdf: exam/final-exam-2021-solutions.pdf, page: 4, label: "Final 2021 Q6"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 8, label: "02a slide 7 (annotated)"}
  added: 2026-10-02
  notes: "The official solution also discusses an 'f5' that is not in the question (version mismatch); ignored."

- id: exam-2020-q5
  type: mcq
  origin: exam_official
  lecture: "02a"
  also_lectures: ["01b"]
  themes: [optimization, sgd]
  priority: core
  front: |
    *(Optimization Algorithm Complexity)* Consider a linear regression problem with $N$ datapoints and $D$ features. Finding the optimal parameters by
    running grid search while trying $P$ values for each feature has approximately *the same* computational complexity as running:
  choices:
    - "$P$ iterations of Gradient Descent or $NP$ iterations of Stochastic Gradient Descent."
    - "$NP^D$ iterations of Gradient Descent or $P^D$ iterations of Stochastic Gradient Descent."
    - "$P^D$ iterations of Gradient Descent or $NP^D$ iterations of Stochastic Gradient Descent."
    - "$PD$ iterations of Gradient Descent or $NPD$ iterations of Stochastic Gradient Descent."
  answer: [2]
  explanation: |
    Official solution: grid search evaluates the cost on $P^D$ points, each evaluation costs $O(ND)$ ⇒ $O(P^DND)$. A GD iteration costs $O(ND)$
    and an SGD iteration $O(D)$, so this equals $P^D$ GD iterations or $NP^D$ SGD iterations.
  sources:
    - {kind: exam, pdf: exam/final-exam-2020-solutions.pdf, page: 3, label: "Final 2020 Q5"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 4, label: "02a slide 3 (annotated)"}
  added: 2026-10-02

- id: exam-2020-q6
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [subgradients]
  priority: core
  front: "*(Subgradients)* Consider the function $f(x) = -x^2$. Which of the following statements are true regarding subgradients of $f(x)$ at $x = 0$?"
  choices:
    - "A subgradient does not exist as $f(x)$ is differentiable at $x = 0$."
    - "A subgradient exists but is not unique."
    - "A subgradient exists and is unique."
    - "A subgradient does not exist even though $f(x)$ is differentiable at $x = 0$."
  answer: [3]
  explanation: |
    Official solution: no subgradient exists even though $f$ is differentiable at 0, because $f$ is concave: a subgradient $g$ needs
    $-u^2 \ge 0 + g\,u$ for **all** $u$, impossible (take $u$ large). Differentiability alone does not give a subgradient — convexity does.
  trap: "'Differentiable ⇒ gradient is the subgradient' holds only for convex functions."
  sources:
    - {kind: exam, pdf: exam/final-exam-2020-solutions.pdf, page: 4, label: "Final 2020 Q6"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 32, label: "02a slide 32 (annotated)"}
  added: 2026-10-02

