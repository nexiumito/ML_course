- id: exam-2024-q38
  type: tf
  origin: exam_official
  lecture: "02a"
  themes: [gradient-descent]
  priority: core
  front: |
    *(Optimization)* Given a continuous, strictly convex, loss function $L(w)$, a gradient descent step $w_{t+1} = w_t - \eta\nabla L(w_t)$ with learning
    rate $\eta > 0$, results in a decrease in the loss, i.e. $L(w_{t+1}) \le L(w_t)$.
  answer: false
  explanation: |
    Official solution: only true with additional constraints on the learning rate. Counterexample: $L(w) = w^2$, $\eta = 2$, $w_t = 1$ gives
    $w_{t+1} = 1 - 2\cdot 2 = -3$ and $L(w_{t+1}) = 9 > 1 = L(w_t)$.
  trap: "Convexity does not save you from a too-large step-size."
  sources:
    - {kind: exam, pdf: exam/final-exam-2024-solutions.pdf, page: 16, label: "Final 2024 Q38"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 36, label: "02a slide 36 (annotated)"}
  added: 2026-10-02

- id: exam-2023-q4
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [gradient-descent]
  priority: core
  front: |
    We are using Gradient Descent to find the 1-dimensional global minimum $w^\star$ by optimizing the loss function $L(w)$ at iteration $t$. $L(w)$ is
    strictly convex, so it has a unique minimum. If $w_t > w^\star$, what is true about the gradient of the loss function, $\nabla L(w_t)$, and the next
    iteration of the parameter $w_{t+1}$?
  choices:
    - "$\\nabla L(w_t) > 0$ and $w_{t+1} < w_t$"
    - "$\\nabla L(w_t) < 0$ and $w_{t+1} < w_t$"
    - "$\\nabla L(w_t) > 0$ and $w_{t+1} > w_t$"
    - "$\\nabla L(w_t) < 0$ and $w_{t+1} > w_t$"
  answer: [0]
  explanation: |
    Official solution: to the right of the minimum a strictly convex function is increasing, so $\nabla L(w_t) > 0$; the step
    $w_{t+1} = w_t - \gamma\nabla L(w_t)$ then decreases $w$, moving towards $w^\star$.
  sources:
    - {kind: exam, pdf: exam/final-exam-2023-solutions.pdf, page: 3, label: "Final 2023 Q4"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 13, label: "02a slide 12 (annotated)"}
  added: 2026-10-02

- id: exam-2022-q4
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [gradient-descent]
  priority: core
  front: |
    Consider the loss function $L : \mathbb{R}^d \to \mathbb{R}$, $L(\mathbf{w}) = \frac{\beta}{2}\|\mathbf{w}\|^2$, where $\beta > 0$ is a constant. We run gradient descent
    on $L$ with a stepsize $\gamma > 0$ starting from some $\mathbf{w}_0 \ne 0$. Which of the statements below is true?
  choices:
    - "Gradient descent converges in two steps for $\\gamma = \\frac1\\beta$ (i.e., $\\mathbf{w}_2$ is the **first** iterate attaining the global minimum of $L$)."
    - "Gradient descent with stepsize $\\gamma = \\frac2\\beta$ produces iterates that diverge to infinity ($\\|\\mathbf{w}_t\\| \\to \\infty$ as $t \\to \\infty$)."
    - "Gradient descent converges to the global minimum for any stepsize $\\gamma > 0$."
    - "Gradient descent converges to the global minimum for any stepsize in the interval $\\gamma \\in \\big(0, \\frac2\\beta\\big)$."
  answer: [3]
  explanation: |
    Official solution: $\mathbf{w}_{t+1} = \mathbf{w}_t - \gamma\beta\mathbf{w}_t = (1-\gamma\beta)\mathbf{w}_t$, so $\|\mathbf{w}_t\| = |1-\gamma\beta|^t\|\mathbf{w}_0\|$.
    $\gamma = \frac1\beta$ reaches $0$ in **one** step (not two); $\gamma = \frac2\beta$ gives $|1-\gamma\beta| = 1$: the norm never changes (oscillation, no divergence);
    large $\gamma$ diverges; any $\gamma \in (0, \frac2\beta)$ gives $|1-\gamma\beta| < 1$ ⇒ convergence. Same picture as the 1-D example of the lecture.
  sources:
    - {kind: exam, pdf: exam/final-exam-2022-solutions.pdf, page: 3, label: "Final 2022 Q4"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 14, label: "02a slide 13 (annotated)"}
  added: 2026-10-02

