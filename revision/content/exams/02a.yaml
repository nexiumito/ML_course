- id: exam-2021-q5
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [optimization]
  priority: core
  front: |
    *(Optimization)* Let $n$ be an integer such that $n \ge 2$ and let $A \in \mathbb{R}^{n\times n}$, and $\mathbf{x} \in \mathbb{R}^n$, consider the function
    $f(\mathbf{x}) = \mathbf{x}^\top A\mathbf{x}$ defined over $\mathbb{R}^n$. Which of the following is the gradient of the function $f$?
  choices: ["$A^\\top\\mathbf{x} + A\\mathbf{x}$", "$2A^\\top\\mathbf{x}$", "$2\\mathbf{x}^\\top A$", "$2A\\mathbf{x}$"]
  answer: [0]
  explanation: |
    Official solution: $\nabla f(\mathbf{x}) = A^\top\mathbf{x} + A\mathbf{x}$; here $A$ is **not** assumed symmetric, so it does not simplify to $2A\mathbf{x}$.
    $2\mathbf{x}^\top A$ is a row vector (wrong shape).
  trap: "2Ax only if A is symmetric."
  sources:
    - {kind: exam, pdf: exam/final-exam-2021-solutions.pdf, page: 3, label: "Final 2021 Q5"}
