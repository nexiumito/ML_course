- id: exam-2017-q13
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [subgradients]
  priority: core
  front: "Which of the following scalars $g$ is a subgradient for the function shown in Figure 2 at the point $x = 1$?"
  images:
    - {src: img/exam-2017-q13.png, alt: "Piecewise-linear function on [-1, 2]: rises from (-1,-3) to a peak (0,-1), decreases to (1,-2), then flat at -2 until x = 2."}
  choices: ["$g = -\\frac12$", "$g = -1$", "none exists", "$g = 0$"]
  answer: [2]
  explanation: |
    Official solution: none exists. A subgradient at $x = 1$ needs the line $-2 + g(x-1)$ to be a global lower bound: the flat part on the right forces
    $g \le 0$, while the point $(-1, -3)$ on the left forces $-2 - 2g \le -3$, i.e. $g \ge \frac12$. Impossible — the function is not convex there.
  sources:
    - {kind: exam, pdf: exam/final-exam-2017-solutions.pdf, page: 8, label: "Final 2017 P13"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 32, label: "02a slide 32 (annotated)"}
