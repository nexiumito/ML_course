- id: exam-2017-q14
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [convexity]
  priority: core
  front: |
    Consider the composite function $f(x) = g(h(x))$, where all functions are $\mathbb{R}$ to $\mathbb{R}$. Which of the following is the weakest condition that
    guarantees that $f(x)$ is convex?
  choices:
    - "$g(x)$ and $h(x)$ are convex and $g(x)$ and $h(x)$ are increasing"
    - "$g(x)$ is convex and $g(x)$ is increasing"
    - "$g(x)$ and $h(x)$ are convex and $h(x)$ is increasing"
    - "$g(x)$ and $h(x)$ are convex and $g(x)$ is increasing"
    - "$g(x)$ is convex and $g(x)$ and $h(x)$ are increasing"
    - "$h(x)$ is convex and $g(x)$ and $h(x)$ are increasing"
    - "$g(x)$ is convex and $h(x)$ is increasing"
  answer: [3]
  explanation: |
    Official solution: $f'' = g''(h)\,(h')^2 + g'(h)\,h''$. Both terms are $\ge 0$ if $g$ is convex ($g'' \ge 0$), $h$ is convex ($h'' \ge 0$) and $g$ is increasing ($g' \ge 0$).
    Requiring $h$ increasing as well is not needed (stronger, not weakest); dropping the convexity of $h$ or the monotonicity of $g$ breaks the guarantee.
  sources:
    - {kind: exam, pdf: exam/final-exam-2017-solutions.pdf, page: 8, label: "Final 2017 P14"}
  added: 2026-10-02

- id: exam-2016-q4
  type: mcq
  origin: exam_official
  lecture: "02a"
  themes: [convexity, optimization]
  priority: core
  front: "The following function(s) have a unique minimizer. *(More than one answer can be correct.)*"
  choices:
    - "$f(x) = x^2$, $x \\in [-3, 2]$"
    - "$f(x) = \\log(x)$, $x \\in (0, 10]$"
    - "$f(x) = \\sin(x)$, $x \\in [-10, 10]$"
    - "$f(x) = e^{3x} + x^4 - 3x$, $x \\in [-10, 10]$"
  answer: [0, 3]
  multi: true
  shuffle: false
  explanation: |
    Official solution: (a) and (d) are strictly convex, hence have a unique minimizer. $\log x$ does not attain its minimum on $(0, 10]$ (it tends to
    $-\infty$ at 0), and $\sin x$ has several minima on $[-10, 10]$.
