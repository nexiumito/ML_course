# Official past-exam questions whose primary lecture is 03c (stems and choices verbatim). Added in S4 (2026-10-02).

- id: exam-2023-q3
  type: mcq
  origin: exam_official
  lecture: "03c"
  also_lectures: ["01c"]
  themes: [mle, loss-functions]
  priority: core
  front: |
    *(Log-likelihood)* Let us assume that our data is generated by the model $y_n = \mathbf{x}_n^\top\mathbf{w}_\text{true} + \varepsilon_n$, where $\varepsilon_n$ follows a random
    distribution such that $p(y_n \mid \mathbf{x}_n, \mathbf{w}_\text{true}) = \frac{1}{2b}e^{-\tfrac1b|y_n - \mathbf{x}_n^\top\mathbf{w}_\text{true}|}$, and $b$ is a fixed parameter.
    We would like to maximize log-likelihood to find a good estimate of $\mathbf{w}_\text{true}$. Which of the following formulations is **NOT** equivalent to MLE?
  choices:
    - '$\arg\min_\mathbf{w}\ \sum_{n=1}^N |y_n - \mathbf{x}_n^\top\mathbf{w}|$'
    - '$\arg\min_\mathbf{w}\ \sum_{n=1}^N \frac1b|y_n - \mathbf{x}_n^\top\mathbf{w}|$'
    - '$\arg\max_\mathbf{w}\ \prod_{n=1}^N p(y_n \mid \mathbf{x}_n, \mathbf{w})$'
    - '$\arg\min_\mathbf{w}\ \log(p(\mathbf{y} \mid \mathbf{x}, \mathbf{w}))$'
  answer: [3]
  explanation: |
    Official solution: maximizing the likelihood = maximizing its log = minimizing the **negative** log. Minimizing the log-likelihood itself is the opposite.
    With Laplace noise the negative log-likelihood is $\frac1b\sum_n|y_n - \mathbf{x}_n^\top\mathbf{w}|$ + cnst (MAE); the factor $\frac1b$ does not change the argmin.
  trap: "argmin of the log-likelihood ≠ MLE (sign!)."
  sources:
    - {kind: exam, pdf: exam/final-exam-2023-solutions.pdf, page: 3, label: "Final 2023 Q3"}
    - {kind: lecture, pdf: lectures/03/lecture03c_maximum_likelihood_annotated.pdf, page: 11, label: "03c slide 10 (annotated)"}
  added: 2026-10-02

- id: exam-2020-q1
  type: mcq
  origin: exam_official
  lecture: "03c"
  also_lectures: ["01b"]
  themes: [mle, least-squares]
  priority: core
  front: |
    *(Linear Regression)* Under certain conditions, maximizing the log-likelihood is equivalent to minimizing mean-squared error for linear regression. The mean-squared
    error can be defined as $$\mathcal{L}_{mse}(\mathbf{w}) := \frac{1}{2N}\sum_{n=1}^N \big(y_n - \tilde{\mathbf{x}}_n^\top\mathbf{w}\big)^2$$ and
    $y_n = \tilde{\mathbf{x}}_n^\top\mathbf{w} + \varepsilon_n$ is assumed for the probabilistic model. Which of following conditions is necessary for the equivalence?
  choices:
    - 'The noise parameter $\varepsilon_n$ should have a normal distribution.'
    - 'The target variable $y_n$ should have a normal distribution.'
    - 'The i.i.d. assumption on the variable $\mathbf{w}$.'
    - 'The conditional probability $p(y_n \mid \tilde{\mathbf{x}}_n, \mathbf{w})$ should follow a Laplacian distribution.'
    - 'The noise parameter $\varepsilon_n$ should have non-zero mean.'
  answer: [0]
  explanation: |
    Official solution: the noise must be Gaussian with **zero** mean. No assumption is made on the (marginal) distribution of the targets; the i.i.d. assumption is on the
    samples (to write the likelihood as a product), not on $\mathbf{w}$; a Laplacian conditional gives the MAE instead.
  trap: "Gaussian NOISE (conditional p(yₙ | xₙ, w)), not Gaussian targets."
  sources:
    - {kind: exam, pdf: exam/final-exam-2020-solutions.pdf, page: 2, label: "Final 2020 Q1"}
    - {kind: lecture, pdf: lectures/03/lecture03c_maximum_likelihood_annotated.pdf, page: 4, label: "03c slide 3 (annotated)"}
  added: 2026-10-02

- id: exam-2019-q20
  type: tf
  origin: exam_official
  lecture: "03c"
  also_lectures: ["03d"]
  themes: [mle, probability]
  priority: detail
  front: |
    *(Maximum Likelihood)* Assume that $X \in \{0, 1\}$ and that $p(X = 0) = \frac13$. Assume further that $Y = X + Z$ where $Z$ is a zero-mean Gaussian noise of variance 1.
    We observe $Y$ and are asked to guess $X$. The maximum likelihood estimator $\hat X(Y) = \arg\max_{x\in\{0,1\}} p(Y = y \mid X = x)$ minimizes the probability of error.
  answer: false
  explanation: |
    Official solution: the error-minimizing estimator is the **maximum a posteriori** one, $\arg\max_x p(X = x)\,p(Y = y \mid X = x)$. Here the prior is not uniform:
    ML decides 1 iff $y > 1/2$, MAP decides 1 iff $y > 1/2 - \ln 2$, so they differ for $y \in (1/2 - \ln 2,\ 1/2)$, where ML errs more often.
  trap: "ML ignores the prior; MAP = ML only with a uniform prior."
  sources:
    - {kind: exam, pdf: exam/final-exam-2019-solutions.pdf, page: 9, label: "Final 2019 Q20"}
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 18, label: "03d slide 18 (MAP)"}
  added: 2026-10-02
  notes: "MAP threshold computed by hand 2026-10-02: (1/3)e^{-y²/2} vs (2/3)e^{-(y-1)²/2} ⇒ y > 1/2 − ln 2."
