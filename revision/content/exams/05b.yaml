- id: exam-2019-q6
  type: mcq
  origin: exam_official
  lecture: "05b"
  themes: [logistic-regression]
  priority: core
  front: |
    *(Houston we have an Overflow Problem)* Assume that you want to implement the sigmoid function: $\sigma(x) = e^x/(e^x + 1)$. You know that your
    computer can handle numbers with very small absolute value but might overflow when dealing with numbers that have a very large absolute value.
    Let $f_1(x) = e^x/(e^x + 1)$ and $f_2(x) = 1/(e^{-x} + 1)$. Which of the following implementations is best?
  choices: ["$f_1(x)$", "$f_2(x)$", "$f_1(x)$ if $x > 0$ and $f_2(x)$ otherwise", "$f_2(x)$ if $x > 0$ and $f_1(x)$ otherwise"]
  answer: [3]
  explanation: |
    Official solution: use $f_2$ for $x > 0$ (then $e^{-x} \le 1$) and $f_1$ otherwise (then $e^x \le 1$): no exponential of a large positive number
    is ever computed. $f_1$ alone overflows for large positive $x$, $f_2$ alone for very negative $x$; the third choice does both wrong.
  sources:
    - {kind: exam, pdf: exam/final-exam-2019-solutions.pdf, page: 4, label: "Final 2019 Q6"}
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 5, label: "05b p. 5"}
  added: 2026-10-09

- id: exam-2016-q12
  type: mcq
  origin: exam_official
  lecture: "05b"
  also_lectures: ["03d"]
  themes: [logistic-regression, loss-functions, regularization]
  priority: core
  front: "Mark the true statements."
  choices:
    - "Logistic loss is typically preferred over $L_2$ loss (least squares loss) in classification tasks."
    - "In terms of feature selection, $L_2$ regularization is often preferred since it comes up with sparse solutions."
  answer: [0]
  multi: true
  shuffle: false
  explanation: |
    Official solution: only the first. With the logistic loss, correctly classified points far from the decision boundary have much less impact
    on the boundary. Sparse solutions (feature selection) come from $L_1$ regularization (lasso), not $L_2$.
  sources:
    - {kind: exam, pdf: exam/final-exam-2016-solutions.pdf, page: 4, label: "Final 2016 Q12"}
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 29, label: "05a p. 29"}
  added: 2026-10-09
