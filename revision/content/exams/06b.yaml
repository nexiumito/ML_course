- id: exam-2020-q7
  type: mcq
  origin: exam_official
  lecture: "06b"
  also_lectures: ["05b"]
  themes: [knn, bias-variance, overfitting]
  priority: core
  front: |
    *(Train/Test Errors)* The above figure was produced by changing a hyperparameter in a classifier on a non-linearly separable training dataset.
    For which classifier could this picture be produced and how was its hyperparameter changed?
  images:
    - {src: img/exam-2020-q7.png, alt: "Train and test error versus an unlabeled hyperparameter axis: train error decreases slowly from 0.16 then drops to 0 at the right end; test error first decreases from 0.22 to about 0.15 then rises to 0.21."}
  choices:
    - "Logistic regression, increasing regularization parameter $\\lambda$."
    - "Logistic regression, decreasing regularization parameter $\\lambda$."
    - "K-nearest neighbor classifier, decreasing number of neighbors $k$."
    - "K-nearest neighbor classifier, increasing number of neighbors $k$."
  answer: [2]
  explanation: |
    Official solution: since the dataset is not linearly separable, zero training error is impossible for (linear) logistic regression; for k-NN
    with $k = 1$ the training error is always zero. The training error reaching 0 on the right means $k$ decreases towards 1, and the U-shaped
    test error is the k-NN bias–variance trade-off (06b p. 23).
  sources:
    - {kind: exam, pdf: exam/final-exam-2020-solutions.pdf, page: 5, label: "Final 2020 Q7"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 23, label: "06b p. 23"}
  added: 2026-10-20

- id: exam-2019-q4
  type: mcq
  origin: exam_official
  lecture: "06b"
  themes: [knn, curse-of-dimensionality]
  priority: core
  front: |
    *(KNN Classifier)* You are in $D$-dimensional space and use a KNN classifier with $k = 1$. You are given $N$ samples and by running experiments
    you see that for most random inputs $x$ you find a nearest sample at distance roughly $\delta$.

    You would like to decrease this distance to $\delta/2$. How many samples will you likely need? Give an educated guess.
  choices: ["$2^D N$", "$N^D$", "$2D$", "$\\log(D) N$", "$N^2$", "$D^2$", "$2N$", "$DN$"]
  answer: [0]
  explanation: |
    Official solution: assume the data really fill $\mathbb R^D$. Balls of radius $\delta$ around the samples roughly cover the space; to cover it
    with balls of radius $\delta/2$ you need about $2^D$ times as many, since the volume of a ball of radius $r$ scales like $r^D$ ⇒ $2^D N$ samples.
  trap: "Volume ∝ r^D: halving the radius costs a factor 2^D."
  sources:
    - {kind: exam, pdf: exam/final-exam-2019-solutions.pdf, page: 3, label: "Final 2019 Q4"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 29, label: "06b p. 29"}
  added: 2026-10-20

- id: exam-2019-q13
  type: tf
  origin: exam_official
  lecture: "06b"
  themes: [knn, overfitting]
  priority: core
  front: "*(Nearest Neighbor)* The training error of the 1-nearest neighbor classifier is zero."
  answer: true
  explanation: |
    Official answer: True — for each element of the training set, its nearest neighbor is itself, so 1-NN outputs its own label (assuming no two
    identical inputs with different labels). Zero training error does not prevent generalization (06b p. 36).
  sources:
    - {kind: exam, pdf: exam/final-exam-2019-solutions.pdf, page: 8, label: "Final 2019 Q13"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 22, label: "06b p. 22"}
  added: 2026-10-20

- id: exam-2018-q2
  type: mcq
  origin: exam_official
  lecture: "06b"
  themes: [knn, curse-of-dimensionality]
  priority: core
  front: |
    You are performing classification in $d$ dimensions (where $d$ is very large) using a $k$-nearest neighbor classifier. You have $N$ training
    samples and get an acceptable performance. Your boss hands you a similar classification task but in $2d$ dimensions. How many training samples
    will you need to get a comparable performance? Make an educated guess.
  choices: ["$2N$", "$e^N$", "$N^2$", "$\\sqrt d$", "$e^d$", "$\\sqrt N$", "$\\log(N)$", "$d^2$", "$2d$", "$\\log(d)$"]
  answer: [2]
  explanation: |
    Official solution: the amount of data needed to "cover" the space grows roughly exponentially in the dimension. If $N \approx a^d$, then in
    $2d$ dimensions we need $a^{2d} = (a^d)^2 = N^2$ samples.
  sources:
    - {kind: exam, pdf: exam/final-exam-2018-solutions.pdf, page: 3, label: "Final 2018 P2"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 36, label: "06b p. 36"}
  added: 2026-10-20

- id: exam-2017-q3
  type: mcq
  origin: exam_official
  lecture: "06b"
  themes: [knn, curse-of-dimensionality]
  priority: core
  multi: true
  shuffle: false
  front: |
    We are given a data set $S = \{(x_n, y_n)\}$ for a binary classification task where $x_n$ in $\mathbb R^D$. We want to use a nearest-neighbor
    classifier. In which of the following situations do we have a reasonable chance of success with this approach? [Ignore the issue of complexity.]
  choices:
    - '$n \to \infty$, $D$ is fixed'
    - '$n \to \infty$, $D \ll \ln(n)$'
    - '$n = D^2$, $D \to \infty$'
    - '$n$ is fixed, $D \to \infty$'
  answer: [0, 1]
  explanation: |
    Official solution: if the number of data points is exponential in the dimension, a nearest-neighbor classifier has a chance to work. So when
    $n \to \infty$ and $D$ is fixed or very small compared to $\ln(n)$ (i.e. $n \gg e^D$). $n = D^2$ is only polynomial in $D$, and fixed $n$ with
    $D \to \infty$ is the worst case (06b p. 29–36).
  sources:
    - {kind: exam, pdf: exam/final-exam-2017-solutions.pdf, page: 3, label: "Final 2017 P3"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 36, label: "06b p. 36"}
  added: 2026-10-20

- id: exam-2017-q4
  type: mcq
  origin: exam_official
  lecture: "06b"
  themes: [knn]
  priority: core
  multi: true
  front: "Which of the following statements are true?"
  choices:
    - "The more training examples, the more accurate the prediction of a $k$-nearest-neighbor classifier."
    - "$k$-nearest-neighbors cannot be used for regression."
    - "A $k$-nearest-neighbor classifier is sensitive to outliers."
    - "Training a $k$-nearest-neighbor classifier takes more computational time than applying it / using it for prediction."
  answer: [0, 2]
  explanation: |
    Official solution: there is no traditional "training" for k-NN (prediction is the expensive part); the more data, the more accurate the
    classifier (neighbors get closer, 06b p. 36); it can also be used for regression (average of the neighbors, p. 10); and it is sensitive to
    outliers — around an outlier you will likely make the wrong prediction (especially with small $k$).
  sources:
    - {kind: exam, pdf: exam/final-exam-2017-solutions.pdf, page: 3, label: "Final 2017 P4"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 25, label: "06b p. 25"}
  added: 2026-10-20

- id: exam-2016-q10
  type: mcq
  origin: exam_official
  lecture: "06b"
  also_lectures: ["05a"]
  themes: [knn, polynomial-features]
  priority: core
  multi: true
  front: "Assume you run $k$-nearest neighbor given the data set of the previous problem (Figure 1). Mark the correct statements."
  images:
    - {src: img/exam-2016-q9.png, alt: "Figure 1: square of 2D points; red points form a cross / star shape along both axes (centred at the origin), blue points fill the four corners."}
  choices:
    - "$k$-nearest neighbors with $k = 1$ would work well."
    - "$k$-nearest neighbors with $k = 1$ would work better if we use it on the \"extended\" data with one component added as discussed in the previous problem."
    - "$k$-nearest neighbors with $k = 1$ only works on data that is linearly separable."
  answer: [0]
  explanation: |
    Official solution: only the first is correct. There is a lot of data, the dimension is small and the decision boundaries are fairly simple, so
    1-NN works well. Adding the extra component ($|x_1 x_2|$, which a **linear** classifier needed) does not help nearest neighbors at all and likely
    hurts (higher dimension). Linear separability matters for linear classifiers, not for nearest neighbors.
  sources:
    - {kind: exam, pdf: exam/final-exam-2016-solutions.pdf, page: 3, label: "Final 2016 Q10"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 21, label: "06b p. 21"}
  added: 2026-10-20

- id: mock-2018-q5e
  type: mcq
  origin: exam_official
  lecture: "06b"
  themes: [knn, curse-of-dimensionality, generalization]
  priority: core
  multi: true
  front: "The $k$-nearest neighbor classifier"
  choices:
    - "typically works the better the larger the dimension of the feature space"
    - "can classify up to $k$ classes"
    - "typically works the worse the larger the dimension of the feature space"
    - "can only be applied if the data can be linearly separated"
    - "has a misclassification rate of at most two times the one of the Bayes classifier if we have lots of data"
    - "has a misclassification rate that is two times better than the one of the Bayes classifier"
  answer: [2, 4]
  explanation: |
    Official solution: 3 and 5 are correct. Curse of dimensionality: neighbors become far and uninformative as the dimension grows (06b p. 26–30).
    With lots of data (fixed dimension) the 1-NN error is at most $2L(f_\star)$ (p. 36) — never better than Bayes, which is optimal. The number of
    classes is not limited by $k$, and linear separability is irrelevant for nearest neighbors.
  sources:
    - {kind: exam, pdf: exam/mock-midterm-exam/mock-exam-2018-solutions.pdf, page: 5, label: "Mock 2018 Q5e"}
    - {kind: lecture, pdf: lectures/06/lecture06b.pdf, page: 36, label: "06b p. 36"}
  added: 2026-10-20
