# Lecture 06b — Nearest-Neighbor Classifiers and the Curse of Dimensionality ("06b p. N" = PDF page N, no printed numbers).
# No annotated 06 published (as of 2026-10-20); the 2025 annotated deck (identical slides) was used as a proxy.
# Written 2026-10-20 (week-6 content session), exam-format tf/mcq only (SPEC §8.2).
# Officials in exams/06b.yaml already cover a lot: k-NN regression by averaging (2022 Q34), no training phase (2025 Q38),
# k direction vs bias (2025 Q33), k = N bias/variance + metric sensitivity (2024 Q25), LOO-CV with 1-NN/3-NN (2024 Q20),
# ℓ1 1-NN vs max-margin (2024 Q32), 1-NN bound with intrinsic dimension (2023 Q6), slow in high dimension / must store data /
# any metric (2022 Q21, 2021 Q14), linear vs 1-NN boundary (2020 Q4), train error → 0 when k decreases (2020 Q7),
# halving the NN distance ⇒ 2^D N (2019 Q4), 1-NN training error 0 (2019 Q13), d → 2d ⇒ N² (2018 P2), n vs D (2017 P3),
# k-NN statements incl. outliers (2017 P4), k = 1 vs extended data / linear separability (2016 Q10), ≤ 2× Bayes (mock 2018 5e).
# Already in cards/05a.yaml: k-NN pros/cons, non-parametric, feature scaling.
