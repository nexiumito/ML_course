# Lecture 05b — Logistic Regression (Flammarion deck, no printed slide numbers → labels use the PDF page, "05b p. N").
# No annotated version. Labels are y ∈ {0,1} in this lecture (NLL form); the y ∈ {-1,1} form is only the trap of
# style-05b-loss-labels-pm1. Written in S7 (2026-10-09); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# Officials in exams/05b.yaml already cover: 2-point MLE (2025 Q2), logistic vs linear incl. nonlinear boundary / closed form /
# separable GD (2024 Q8, 2023 Q5), probability change depends on x (2024 Q9), SGD step on a correct point (2023 Q19),
# gradient formula (2022 Q3), standardized weights (2022 Q7), GD vs Newton (2022 Q8), asymmetric loss (2022 Q26, 2016 Q12),
# strong ℓ2 on one weight (2021 Q17), separable ⇒ no exact 0 loss (2021 Q27), logit linear (2020 Q3), medical probability
# (2020 Q27), stable sigmoid (2019 Q6). Own cards: SPEC §8.4 "Week 5" confusions + mini-computations not covered above.

# ---------------------------------------------------------------- model, odds, sigmoid

- id: style-05b-true-prob-range
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, probability]
  priority: core
  front: "*(Motivation)* Logistic regression is needed because the true probability $\\mathbb{P}(Y=1 \\mid X=x)$ can fall outside $[0,1]$ for some inputs $x$."
  answer: false
  explanation: |
    A probability is always in $[0,1]$. What leaves $[0,1]$ is the **linear model** $x^\top w + w_0$ used to approximate it (05b p. 3);
    logistic regression maps the linear score through $\sigma : \mathbb{R} \to\, ]0,1[$.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 3, label: "05b p. 3"}
  added: 2026-10-11

- id: style-05b-odds-ratio
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, probability]
  priority: core
  front: "*(Logistic regression)* With $p(1\\mid x) = \\sigma(\\theta_0 + \\theta_1 x)$, increasing $x$ by one unit multiplies the **odds** $p/(1-p)$ by:"
  choices: ["$e^{\\theta_1}$", "$\\theta_1$", "$\\sigma(\\theta_1)$", "an amount that depends on $x$"]
  answer: [0]
  explanation: |
    The log-odds is linear: $\log\frac{p}{1-p} = \theta_0 + \theta_1 x$ increases by $\theta_1$, so the odds are multiplied by $e^{\theta_1}$.
    It is the **probability** whose change depends on $x$ (saturation of $\sigma$) — Final 2024 Q9.
  trap: "Odds: fixed factor e^θ₁. Probability: change depends on x."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 4, label: "05b p. 4"}
  added: 2026-10-09

- id: style-05b-sigma-prime-zero
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression]
  priority: core
  front: "*(Logistic function)* What is $\\sigma'(0)$ for $\\sigma(\\eta) = 1/(1+e^{-\\eta})$?"
  choices: ["$1/4$", "$1/2$", "$1$", "$0$"]
  answer: [0]
  explanation: "$\\sigma'(\\eta) = \\sigma(\\eta)(1-\\sigma(\\eta))$ and $\\sigma(0) = \\frac12$, so $\\sigma'(0) = \\frac14$ — the maximum slope. $\\frac12$ is $\\sigma(0)$ itself."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 5, label: "05b p. 5"}
  added: 2026-10-09

- id: style-05b-decision-rule
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, classification]
  priority: core
  front: "*(Logistic regression, $y \\in \\{0,1\\}$)* With $p(1 \\mid x) = \\sigma(x^\\top w + w_0)$, we predict class 1 if and only if:"
  choices:
    - "$x^\\top w + w_0 \\ge 0$"
    - "$x^\\top w + w_0 \\ge 1/2$"
    - "$\\sigma(x^\\top w + w_0) \\ge 0$"
    - "$|x^\\top w + w_0|$ is large"
  answer: [0]
  explanation: |
    Predict 1 iff $p(1\mid x) \ge \frac12$; since $\sigma(0) = \frac12$ and $\sigma$ is increasing, this is $x^\top w + w_0 \ge 0$: only the
    **sign** of the score matters, hence a linear boundary (05b p. 6). The $\frac12$ threshold applies to $\sigma$, not to the score;
    $\sigma > 0$ always holds; a large $|x^\top w + w_0|$ means high **confidence**, in either class.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 6, label: "05b p. 6"}
  added: 2026-10-11

# ---------------------------------------------------------------- geometry

- id: style-05b-scale-w-predictions
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression]
  priority: core
  front: "*(Logistic regression, no bias)* Replacing $w$ by $10\\,w$ changes the predicted class of some inputs."
  answer: false
  explanation: "$\\operatorname{sign}(10\\,w^\\top x) = \\operatorname{sign}(w^\\top x)$: the boundary is unchanged; only the confidence (steepness of $\\sigma$) changes (05b p. 11)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 11, label: "05b p. 11"}
  added: 2026-10-09

- id: style-05b-geometry
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, classification]
  priority: core
  front: "*(Geometry)* In $p(1 \\mid x) = \\sigma(w^\\top x + w_0)$, which change **rotates** the decision boundary?"
  choices:
    - "Changing the direction of $w$"
    - "Multiplying $w$ by $t > 0$"
    - "Changing $w_0$"
    - "Multiplying both $w$ and $w_0$ by $t > 0$"
  answer: [0]
  explanation: |
    The boundary $\{x : w^\top x + w_0 = 0\}$ is orthogonal to $w$ (05b p. 10), so its orientation is the direction of $w$. Scaling $w$
    only makes the transition sharper or smoother (p. 11); $w_0$ shifts the boundary along $w$ (p. 12); scaling $(w, w_0)$ together
    leaves the set $\{w^\top x + w_0 = 0\}$ unchanged. $w_0$ is learned like $w$ (constant-1 feature, p. 13), not a hyperparameter.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 10, label: "05b p. 10"}
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 12, label: "05b p. 12"}
  added: 2026-10-11

# ---------------------------------------------------------------- likelihood, NLL, loss

- id: style-05b-likelihood-setup
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, mle]
  priority: core
  front: |
    *(MLE)* Model $\mathbb{P}(y = 1 \mid x; w) = \sigma(w x)$ with $x \in \mathbb{R}$, data $(x_1, y_1) = (1, 1)$ and $(x_2, y_2) = (2, 0)$,
    inputs independent of $w$. The likelihood $p(\mathbf{y} \mid \mathbf{X}, w)$ is:
  choices:
    - "$\\sigma(w)\\,\\sigma(-2w)$"
    - "$\\sigma(w)\\,\\sigma(2w)$"
    - "$\\sigma(w) + \\sigma(-2w)$"
    - "$\\sigma(w)$"
  answer: [0]
  explanation: |
    i.i.d. ⇒ **product** over the points of $\sigma(x_n w)^{y_n}[1 - \sigma(x_n w)]^{1-y_n}$ (05b p. 15): $\sigma(w) \cdot (1 - \sigma(2w))$,
    and $1 - \sigma(\eta) = \sigma(-\eta)$ (p. 5). $\sigma(w)\sigma(2w)$ treats the $y=0$ point as class 1; a sum is not a joint
    probability; $\sigma(w)$ alone drops the factor $[1-\sigma(2w)]^{1-y_2}$ of the second point.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 15, label: "05b p. 15"}
  added: 2026-10-11

- id: style-05b-nll-form
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, mle, loss-functions]
  priority: core
  front: "*(Logistic regression, $y_n \\in \\{0,1\\}$)* Which cost $L(w)$ do we **minimize** to get the maximum-likelihood $w$?"
  choices:
    - "$\\frac1N\\sum_n \\big[-y_n x_n^\\top w + \\log(1 + e^{x_n^\\top w})\\big]$"
    - "$\\frac1N\\sum_n \\big[y_n x_n^\\top w - \\log(1 + e^{x_n^\\top w})\\big]$"
    - "$\\frac1N\\sum_n \\log(1 + e^{-y_n x_n^\\top w})$"
    - "$\\frac1N\\sum_n \\big(y_n - \\sigma(x_n^\\top w)\\big)^2$"
  answer: [0]
  explanation: |
    Negative log of $\prod_n \sigma(x_n^\top w)^{y_n}[1-\sigma(x_n^\top w)]^{1-y_n}$, divided by $N$ (05b p. 16). The second option is the
    log-likelihood itself (to be **maximized**; the minus sign turns it into a convex cost). The third is the form for labels
    $y \in \{-1,1\}$ (p. 17): with $y_n = 0$ it is the constant $\log 2$. The last is a square loss on $\sigma$, not the NLL.
  trap: "Labels {0,1} vs {−1,1}: two different formulas — never mix them."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 16, label: "05b p. 16"}
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 17, label: "05b p. 17"}
  added: 2026-10-11

- id: style-05b-loss-labels-pm1
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, loss-functions]
  priority: core
  front: "*(Logistic loss)* With labels $y \\in \\{0, 1\\}$, the logistic loss of a sample can be written $\\log\\big(1 + \\exp(-y\\,x^\\top w)\\big)$."
  answer: false
  explanation: |
    That form is for $y \in \{-1, 1\}$ (05b p. 17). With $y \in \{0,1\}$ the loss is $-y\,x^\top w + \log(1 + e^{x^\top w})$; plugging $y = 0$
    into $\log(1 + e^{-y x^\top w})$ would give $\log 2$ whatever $w$, so class-0 points would not influence training.
  trap: "Check the label convention before writing the logistic loss."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 17, label: "05b p. 17"}
  added: 2026-10-11

- id: style-05b-nll-is-erm
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, loss-functions]
  priority: core
  front: "*(Logistic loss)* Minimizing the negative log-likelihood of logistic regression is the same as empirical risk minimization with the logistic loss, a convex surrogate of the 0-1 loss."
  answer: true
  explanation: |
    05b p. 17: "the negative log likelihood is equivalent to ERM for the logistic loss (a surrogate for 0-1 loss)". The same loss with
    $g(x)$ = output of a neural network is the cross-entropy used in deep learning.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 17, label: "05b p. 17"}
  added: 2026-10-11

# ---------------------------------------------------------------- gradient, convexity

- id: style-05b-gradient-at-zero
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, gradient-descent]
  priority: core
  front: "*(Gradient, $y \\in \\{0,1\\}$)* For $L(w) = \\frac1N\\sum_n[-y_n x_n^\\top w + \\log(1 + e^{x_n^\\top w})]$, what is $\\nabla L(0)$?"
  choices:
    - "$\\frac1N \\mathbf{X}^\\top\\big(\\tfrac12\\mathbf{1} - \\mathbf{y}\\big)$"
    - "$-\\frac1N \\mathbf{X}^\\top\\mathbf{y}$"
    - "$0$"
    - "$\\frac1N \\mathbf{X}^\\top(\\mathbf{1} - \\mathbf{y})$"
  answer: [0]
  explanation: |
    $\nabla L(w) = \frac1N \mathbf{X}^\top(\sigma(\mathbf{X}w) - \mathbf{y})$ (05b p. 18) and $\sigma(0) = \frac12$. Dropping the
    $\log(1+e^{x_n^\top w})$ term gives $-\frac1N\mathbf{X}^\top\mathbf{y}$; $w = 0$ is not stationary in general; $\mathbf{1}$ instead of
    $\frac12\mathbf{1}$ confuses $\sigma(0)$ with $e^0 = 1$.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 18, label: "05b p. 18"}
  added: 2026-10-11

- id: style-05b-convexity-argument
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, convexity]
  priority: core
  front: "*(Convexity)* Which argument shows that $w \\mapsto \\log\\big(1 + e^{x_n^\\top w}\\big)$ is convex?"
  choices:
    - "$h(\\eta) = \\log(1 + e^\\eta)$ has $h'' = \\sigma(1-\\sigma) \\ge 0$, and a convex function of a linear function of $w$ is convex."
    - "The sigmoid $\\sigma$ is convex on $\\mathbb{R}$, and $h' = \\sigma$."
    - "$\\log$ is convex and increasing, and $1 + e^{x_n^\\top w}$ is convex."
    - "Any function of the form $f(x_n^\\top w)$ is convex in $w$."
  answer: [0]
  explanation: |
    05b p. 20–21: $h' = \sigma$, $h'' = \sigma' = e^\eta/(1+e^\eta)^2 \ge 0$, then convex ∘ linear is convex; add the linear term
    $-y_n x_n^\top w$ and average (positive combination). $\sigma$ is S-shaped (convex then concave); $\log$ is **concave**; $f(x_n^\top w)$
    is convex only if $f$ is (e.g. $-(x_n^\top w)^2$ is not).
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 21, label: "05b p. 21"}
  added: 2026-10-11

- id: style-05b-hessian-negative
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, convexity]
  priority: core
  front: "*(Logistic regression)* For some $w$, the Hessian of the logistic NLL has a negative eigenvalue."
  answer: false
  explanation: "$\\nabla^2 L(w) = \\frac1N\\mathbf{X}^\\top S\\mathbf{X}$ with $S \\succeq 0$, so $v^\\top\\nabla^2 L\\,v = \\frac1N\\sum_n s_n(x_n^\\top v)^2 \\ge 0$ for every $w$: always PSD (05b p. 22)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 22, label: "05b p. 22"}
  added: 2026-10-09

# ---------------------------------------------------------------- optimization, separable data

- id: style-05b-sgd-cost
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, sgd]
  priority: core
  front: "*(SGD)* With $N$ samples in dimension $D$, what is the cost of one SGD step for logistic regression?"
  choices: ["$O(D)$", "$O(ND)$", "$O(ND^2)$", "$O(D^3)$"]
  answer: [0]
  explanation: "One sample: one inner product $x_n^\\top w$ and one vector update, $O(D)$, independent of $N$. $O(ND)$ = a full GD step; $O(ND^2)$ = building the Hessian; $O(D^3)$ = solving the Newton system."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 23, label: "05b p. 23"}
  added: 2026-10-09

