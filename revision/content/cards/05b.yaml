- id: style-05b-odds-ratio
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, probability]
  priority: core
  front: "*(Logistic regression)* With $p(1\\mid x) = \\sigma(\\theta_0 + \\theta_1 x)$, increasing $x$ by one unit multiplies the **odds** $p/(1-p)$ by:"
  choices: ["$e^{\\theta_1}$", "$\\theta_1$", "$\\sigma(\\theta_1)$", "an amount that depends on $x$"]
  answer: [0]
  explanation: |
    The log-odds is linear: $\log\frac{p}{1-p} = \theta_0 + \theta_1 x$ increases by $\theta_1$, so the odds are multiplied by $e^{\theta_1}$.
    It is the **probability** whose change depends on $x$ (saturation of $\sigma$) — Final 2024 Q9.
  trap: "Odds: fixed factor e^θ₁. Probability: change depends on x."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 4, label: "05b p. 4"}
  added: 2026-10-09

- id: style-05b-sigma-prime-zero
  type: mcq
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression]
  priority: detail
  front: "*(Logistic function)* What is $\\sigma'(0)$ for $\\sigma(\\eta) = 1/(1+e^{-\\eta})$?"
  choices: ["$1/4$", "$1/2$", "$1$", "$0$"]
  answer: [0]
  explanation: "$\\sigma'(\\eta) = \\sigma(\\eta)(1-\\sigma(\\eta))$ and $\\sigma(0) = \\frac12$, so $\\sigma'(0) = \\frac14$ — the maximum slope. $\\frac12$ is $\\sigma(0)$ itself."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 5, label: "05b p. 5"}
  added: 2026-10-09

- id: style-05b-normal-equations
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, least-squares]
  priority: core
  front: "*(Logistic regression)* Setting $\\nabla L(w) = 0$ for the logistic loss gives linear equations in $w$, solvable in closed form like the normal equations $\\mathbf{X}^\\top\\mathbf{X}w = \\mathbf{X}^\\top\\mathbf{y}$."
  answer: false
  explanation: "$\\mathbf{X}^\\top(\\sigma(\\mathbf{X}w) - \\mathbf{y}) = 0$ is nonlinear in $w$ (inside $\\sigma$): no closed form, iterative methods are needed (05b p. 18)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 18, label: "05b p. 18"}
