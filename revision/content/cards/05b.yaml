- id: style-05b-ridge-finite
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, regularization]
  priority: core
  front: "*(Ridge logistic regression)* On linearly separable data, adding $\\frac\\lambda2\\|w\\|_2^2$ with $\\lambda > 0$ to the logistic loss guarantees that a minimizer exists at a finite $w$."
  answer: true
  explanation: "The penalty grows to $\\infty$ with $\\|w\\|$ while the loss term stays $\\ge 0$, so the objective is coercive (and strictly convex): a unique finite minimizer exists (05b p. 25)."
