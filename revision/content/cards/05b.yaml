- id: style-05b-scale-w-predictions
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression]
  priority: core
  front: "*(Logistic regression, no bias)* Replacing $w$ by $10\\,w$ changes the predicted class of some inputs."
  answer: false
  explanation: "$\\operatorname{sign}(10\\,w^\\top x) = \\operatorname{sign}(w^\\top x)$: the boundary is unchanged; only the confidence (steepness of $\\sigma$) changes (05b p. 11)."
