- id: style-05b-nonlinear-boundary
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, classification]
  priority: core
  front: "*(Logistic regression)* Because the sigmoid is a nonlinear function, logistic regression on the raw features $x$ produces a nonlinear decision boundary."
  answer: false
  explanation: "$\\sigma(x^\\top w + w_0) \\ge \\frac12 \\iff x^\\top w + w_0 \\ge 0$: the boundary is a hyperplane (05b p. 6). Nonlinear boundaries need feature augmentation or kernels."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 6, label: "05b p. 6"}
