- id: style-05b-hessian-negative
  type: tf
  origin: exam_style
  lecture: "05b"
  themes: [logistic-regression, convexity]
  priority: core
  front: "*(Logistic regression)* For some $w$, the Hessian of the logistic NLL has a negative eigenvalue."
  answer: false
  explanation: "$\\nabla^2 L(w) = \\frac1N\\mathbf{X}^\\top S\\mathbf{X}$ with $S \\succeq 0$, so $v^\\top\\nabla^2 L\\,v = \\frac1N\\sum_n s_n(x_n^\\top v)^2 \\ge 0$ for every $w$: always PSD (05b p. 22)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05b.pdf, page: 22, label: "05b p. 22"}
