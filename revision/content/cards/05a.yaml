# ---------------------------------------------------------------- classification by least squares

- id: style-05a-ls-outputs
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification, least-squares]
  priority: core
  front: "*(Classification by regression)* When least squares is fitted on labels $y \\in \\{0,1\\}$, its predictions always lie in $[0,1]$, so they can be read as probabilities."
  answer: false
  explanation: "A linear function is unbounded: the fitted line goes below 0 and above 1 (05a p. 12, point A). Logistic regression fixes this with $\\sigma$."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 12, label: "05a p. 12"}
  added: 2026-10-09

- id: style-05a-ls-threshold
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, least-squares]
  priority: core
  front: |
    *(Classification by regression)* Classes are encoded $C_1 \to 0$, $C_2 \to 1$, least squares is fitted, and we predict $C_2$
    iff $f_{S_\text{train}}(x) \ge 0.5$. What does the threshold $0.5$ represent?
  choices:
    - "The midpoint between the two codes: we predict the class whose code is closest to the output."
    - "The point where $\\mathbb{P}(Y=1 \\mid X=x) = 0.5$, since the least-squares outputs are probabilities."
    - "The fraction of $C_2$ points in the training set."
    - "A hyperparameter that must be tuned by cross-validation."
  answer: [0]
  explanation: |
    $0.5$ is halfway between the codes 0 and 1 (with codes $-1/+1$ the same idea gives the threshold 0, i.e. $\operatorname{sign}(f(x))$).
    It is not a probability threshold: the linear output can be $-0.3$ or $1.4$ (p. 12). It does not depend on the class proportions and
    is fixed by the encoding, not tuned.
  trap: "The least-squares output is not a probability, so 0.5 is not a probability threshold."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 10, label: "05a p. 10"}
  added: 2026-10-11

- id: style-05a-unbalanced
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification, least-squares]
  priority: core
  front: "*(Classification by regression)* With least squares on 0/1 labels, the decision boundary depends only on where the two classes lie, not on how many points each class has."
  answer: false
  explanation: "With a 1:15 ratio the line is flattened towards 0 and the 0.5 crossing moves far away (05a p. 13): the position depends crucially on the class counts."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 13, label: "05a p. 13"}
  added: 2026-10-09

- id: style-05a-extreme-points-move
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification, least-squares, loss-functions]
  priority: core
  front: "*(Classification by regression)* With least squares on 0/1 labels, adding a few points that are far from the boundary and **correctly** classified can move the decision boundary."
  answer: true
  explanation: |
    The square loss penalizes deviations in both directions: a $y=1$ point whose linear output is far above 1 ("too correct") gets a huge
    error, so the fit flattens and the 0.5 crossing moves (05a p. 14). The extreme points are not mislabeled outliers.
  trap: "Square loss punishes confident correct predictions."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 14, label: "05a p. 14"}
  added: 2026-10-11

- id: style-05a-square-loss-confident
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, loss-functions]
  priority: core
  front: |
    *(Losses vs functional margin)* With $y \in \{-1,1\}$ and functional margin $\eta = y\,g(x)$, a point is classified correctly and
    confidently: $\eta = 3$. Which loss penalizes it the most?
  choices:
    - "Square loss $(1-\\eta)^2$"
    - "Logistic loss $\\log(1 + e^{-\\eta})$"
    - "Hinge loss $\\max(0, 1-\\eta)$"
    - "Zero-one loss $1_{\\eta \\le 0}$"
  answer: [0]
  explanation: |
    Square: $(1-3)^2 = 4$. Logistic: $\log(1 + e^{-3}) \approx 0.05$. Hinge: $0$ (since $\eta \ge 1$). Zero-one: $0$ (correct).
    The square loss grows again for $\eta > 1$, which is why it is unsuited to classification (p. 14, p. 29).
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 29, label: "05a p. 29"}
  added: 2026-10-11

# ---------------------------------------------------------------- k-NN

- id: style-05a-knn-true
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, knn]
  priority: core
  front: "*(k-NN)* Which statement about the k-nearest-neighbor classifier is true?"
  choices:
    - "Prediction is slow: each query needs the distances to all training points."
    - "Training requires minimizing a non-convex empirical risk."
    - "Its decision boundaries are always linear."
    - "It works best in high dimension, where neighbors are more informative."
  answer: [0]
  explanation: |
    05a p. 17: pros = no optimization or training, easy, works well in **low** dimension with very complex boundaries; cons = slow at
    query time ($O(ND)$ per prediction), not suitable for high-dimensional data, the choice of the local distance is crucial.
    So there is no training problem to solve, and the boundaries are not linear.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 17, label: "05a p. 17"}
  added: 2026-10-11

- id: style-05a-knn-nonparametric
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification, knn]
  priority: core
  front: "*(k-NN)* k-NN is non-parametric even though it has the number $k$: $k$ is a hyperparameter, and the \"model\" is the training set itself."
  answer: true
  explanation: |
    Non-parametric = no fixed functional form with a fixed number of learned parameters: $\mathbb{P}(Y=y \mid X=x)$ is approximated by
    local averaging over the stored training points (05a p. 26). $k$ is chosen (e.g. by validation), not learned. Parametric methods
    fit a model of fixed size (e.g. $w \in \mathbb{R}^D$) by ERM.
  trap: "Having a number to choose (k) does not make a method parametric."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 26, label: "05a p. 26"}
  added: 2026-10-11

- id: style-05a-knn-scaling
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [knn]
  priority: core
  front: "*(k-NN)* With the Euclidean distance, multiplying one feature by 1000 can change the k-NN predictions even though $k$ is unchanged."
  answer: true
  explanation: |
    $k$ says **how many** neighbors vote; the distance decides **who** the neighbors are. A feature with a huge range dominates the
    Euclidean distance, so the neighbor sets change. "Choosing the right local distance is crucial" (05a p. 17): standardize features.
  trap: "k (how many neighbors) is not the distance (how closeness is measured)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 17, label: "05a p. 17"}
  added: 2026-10-11

# ---------------------------------------------------------------- separating hyperplanes, margin, nonlinear

- id: style-05a-margin-def
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification]
  priority: core
  front: "*(Margin)* The margin of a separating hyperplane is the average distance of the training points to the hyperplane."
  answer: false
  explanation: "The margin is the distance from the hyperplane to the **closest** point (05a p. 20); the max-margin hyperplane maximizes this minimum distance."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 20, label: "05a p. 20"}
  added: 2026-10-09

- id: style-05a-max-margin-why
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification]
  priority: core
  front: "*(Max-margin)* All hyperplanes that separate the training data have zero training error; the max-margin one is preferred because its number of misclassifications stays low if the training set changes slightly."
  answer: true
  explanation: |
    05a p. 21: "If we slightly change the training set, the number of misclassifications will stay low" — this leads to SVM and logistic
    regression. Training error cannot discriminate between separating hyperplanes (all have zero). On p. 21 the two drawn lines are two
    candidate separators compared (small vs max margin), not margin boundaries.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 21, label: "05a p. 21"}
  added: 2026-10-11

- id: style-05a-augmented-boundary
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification, polynomial-features]
  priority: core
  front: "*(Feature augmentation)* A linear classifier trained on augmented features $(x_1, x_2, x_1^2 + x_2^2)$ can only produce a linear decision boundary in the original $(x_1, x_2)$ space."
  answer: false
  explanation: "The boundary is linear in the augmented space, e.g. $x_1^2 + x_2^2 = c$, which is a **circle** in the original space (05a p. 22)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 22, label: "05a p. 22"}
  added: 2026-10-09

# ---------------------------------------------------------------- 0-1 loss, Bayes classifier

- id: style-05a-bayes-rule
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, probability]
  priority: core
  front: "*(Bayes classifier)* For the 0-1 loss, which rule minimizes the true risk $L_\\mathcal{D}(f) = \\mathbb{P}_\\mathcal{D}[Y \\ne f(X)]$?"
  choices:
    - "$f_\\star(x) \\in \\arg\\max_y \\mathbb{P}(Y=y \\mid X=x)$"
    - "$f_\\star(x) \\in \\arg\\max_y \\mathbb{P}(X=x \\mid Y=y)$"
    - "$f_\\star(x) \\in \\arg\\max_y \\mathbb{P}(Y=y)$"
    - "The minimizer of the empirical 0-1 risk on the training set"
  answer: [0]
  explanation: |
    Bayes classifier (05a p. 24): predict the most probable label **given $x$** (the posterior). The likelihood $\mathbb{P}(X=x \mid Y=y)$
    ignores the class priors (it agrees with the posterior only for balanced classes); $\arg\max_y \mathbb{P}(Y=y)$ ignores $x$ (constant
    majority-class rule); ERM on finite data only approximates $f_\star$, which needs the unknown $\mathcal{D}$.
  trap: "Posterior P(Y|X), not likelihood P(X|Y)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 23, label: "05a p. 23"}
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 24, label: "05a p. 24"}
  added: 2026-10-11

- id: style-05a-bayes-finite-data
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification]
  priority: core
  front: "*(Bayes classifier)* Given a large enough finite training set, the Bayes classifier can be computed exactly by empirical risk minimization."
  answer: false
  explanation: "The Bayes classifier depends on the true conditional $\\mathbb{P}(Y \\mid X)$ of the unknown $\\mathcal{D}$: it is an unattainable gold standard (05a p. 24). ERM only approximates it."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 24, label: "05a p. 24"}
  added: 2026-10-09

- id: style-05a-bayes-toy
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, probability]
  priority: core
  front: |
    *(Bayes classifier)* $X \in \{a, b\}$ with $\mathbb{P}(X=a) = 0.6$, $\mathbb{P}(X=b) = 0.4$, and
    $\mathbb{P}(Y=+1 \mid a) = 0.8$, $\mathbb{P}(Y=+1 \mid b) = 0.3$. What is the error of the Bayes classifier?
  choices: ["$0.24$", "$0.40$", "$0.76$", "$0.12$"]
  answer: [0]
  explanation: |
    Bayes: $a \mapsto +1$ (0.8 > 0.2), $b \mapsto -1$ (0.7 > 0.3). At each $x$ the error is the probability of the label **not** chosen:
    $0.6 \cdot 0.2 + 0.4 \cdot 0.3 = 0.24$. $0.40$ is the error of "always $+1$" ($0.6 \cdot 0.2 + 0.4 \cdot 0.7$); $0.76$ is the Bayes
    **accuracy**; $0.12$ forgets the $x = b$ term (step 2 of the proof: average over $x$, weighted by $\mathbb{P}(X=x)$).
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 25, label: "05a p. 25"}
  added: 2026-10-11
  notes: "Toy example of the 2026-10-08 catch-up session; numbers checked."

- id: style-05a-bayes-risk
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, probability]
  priority: core
  front: "*(Bayes risk)* With $\\eta(x) = \\mathbb{P}(Y=1 \\mid X=x)$ and $Y \\in \\{-1, 1\\}$, what is the 0-1 risk $L^\\star$ of the Bayes classifier?"
  choices:
    - "$\\mathbb{E}_X\\big[\\min(\\eta(X),\\, 1-\\eta(X))\\big]$"
    - "$\\mathbb{E}_X\\big[\\max(\\eta(X),\\, 1-\\eta(X))\\big]$"
    - "$\\min\\big(\\mathbb{E}_X[\\eta(X)],\\, 1-\\mathbb{E}_X[\\eta(X)]\\big)$"
    - "$0$"
  answer: [0]
  explanation: |
    Predicting the most probable label at $x$, you are wrong with the probability of the **less** probable one, $\min(\eta, 1-\eta)$;
    then average over $X$ (tower rule). The $\max$ version is the Bayes **accuracy**; $\min(\mathbb{E}[\eta], 1-\mathbb{E}[\eta])$ is the
    error of the best **constant** classifier (it ignores $x$); $0$ only if $Y$ is a deterministic function of $X$.
    Final 2022 Q39 (open problem, 2 pts) asks to prove it; not written on the slides, follows from p. 25.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 25, label: "05a p. 25"}
    - {kind: exam, pdf: exam/final-exam-2022-solutions.pdf, page: 15, label: "Final 2022 Q39"}
  added: 2026-10-11

# ---------------------------------------------------------------- ERM, convex relaxation, surrogates

- id: style-05a-zero-one-convex
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification, convexity]
  priority: core
  front: "*(ERM)* Minimizing the empirical 0-1 loss $\\frac1N\\sum_n 1_{y_n x_n^\\top w \\le 0}$ over $w \\in \\mathbb{R}^D$ is a convex problem."
  answer: false
  explanation: "The indicator is a step function (discontinuous, not convex): the 0-1 risk is not convex in $w$. Replacing it by a convex surrogate $\\phi$ makes the problem convex (05a p. 27–28)."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 27, label: "05a p. 27"}
  added: 2026-10-09

- id: style-05a-convex-relaxation
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, convexity, loss-functions]
  priority: core
  front: "*(Convex relaxation)* Empirical 0-1 risk minimization over classifiers $f : \\mathcal{X} \\to \\{-1,1\\}$ is not convex. Which change gives a convex problem?"
  choices:
    - "Learn a real-valued score $g(x) = x^\\top w$, predict $\\operatorname{sign}(g(x))$, and replace $1_{y_n g(x_n) \\le 0}$ by a convex surrogate $\\phi(y_n g(x_n))$."
    - "Keep the 0-1 loss and add the penalty $\\lambda \\|w\\|_2^2$."
    - "Restrict the training set to linearly separable data."
    - "Keep the outputs in $\\{-1,1\\}$ and use the square loss $(y_n - f(x_n))^2$."
  answer: [0]
  explanation: |
    05a p. 28: (1) real-valued $g$ in a convex class instead of a discrete-valued $f$; (2) convex surrogate of the functional margin.
    Then $w \mapsto \phi(y_n x_n^\top w)$ is convex ∘ linear and the sum is convex. A non-convex term plus $\lambda\|w\|^2$ is still not
    convex; separable data do not change the step shape of the indicator; with outputs in $\{-1,1\}$ the set of classifiers stays discrete.
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 28, label: "05a p. 28"}
  added: 2026-10-11

- id: style-05a-hinge-zero
  type: tf
  origin: exam_style
  lecture: "05a"
  themes: [classification, loss-functions]
  priority: core
  front: "*(Surrogate losses)* With $y \\in \\{-1,1\\}$, the hinge loss $\\max(0,\\, 1 - y\\,g(x))$ is zero for every correctly classified point."
  answer: false
  explanation: |
    It is zero only when the functional margin $y\,g(x) \ge 1$. A point with $0 < y\,g(x) < 1$ is correctly classified but still pays
    $1 - y\,g(x) > 0$ (05a p. 29 plot). Hinge loss → max-margin classification (SVM); logistic loss → logistic regression.
  trap: "Correct side ≠ zero hinge loss: the margin must be at least 1."
  sources:
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 29, label: "05a p. 29"}
  added: 2026-10-11
  notes: "Hinge formula read from the p. 29 plot (0 for η ≥ 1, slope −1 below); formally defined in the SVM lecture."

# ---------------------------------------------------------------- evaluation

- id: style-05a-imbalanced-accuracy
  type: mcq
  origin: exam_style
  lecture: "05a"
  themes: [classification, generalization]
  priority: core
  front: |
    *(Imbalanced data)* 90% of the labeled data have label 0. You split randomly into two halves, train on one and test on the other, and get
    85% test accuracy. What is the right reaction?
  choices:
    - "The classifier is worse than the trivial rule \"always predict 0\", which gets about 90%."
    - "85% is a good result: well above the 50% of random guessing."
    - "The model overfits: the test accuracy should be compared with the training accuracy only."
    - "Nothing can be concluded without knowing the number of features."
  answer: [0]
  explanation: |
    Always compare with the constant baseline: predicting the majority class gives ≈ 90% accuracy, so 85% means the model is doing worse
    than nothing. Random guessing (50%) is the wrong reference on imbalanced data. Adapted from Final 2017 P25 (open question).
  trap: "On imbalanced data the reference is the majority-class rate, not 50%."
  sources:
    - {kind: exam, pdf: exam/final-exam-2017-solutions.pdf, page: 18, label: "Final 2017 P25"}
    - {kind: lecture, pdf: lectures/05/lecture05a.pdf, page: 13, label: "05a p. 13"}
  added: 2026-10-09
