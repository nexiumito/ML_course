# Lecture 03d — Ridge Regression and Lasso (Jaggi deck; annotated PDF: slide N = page N+1 up to slide 13, additional notes after).
# Written in S4 (2026-10-02); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# Officials in exams/03d.yaml cover: ridge invertible for d > n (2025 Q7), lasso vs ridge (2024 Q18), lasso scale (2024 Q19),
# ridge not sparse (2023 Q16), C_λ monotone (2022 Q2), Laplace prior ↔ lasso (2022 Q5), λ direction (2022 Q25), L1 statements
# (2021 Q8), ridge by hand (2021 Q15), train/test error vs λ (2018 P14), why regularize (mock 2018 5d).
# SPEC §8.4 points kept: λ vs degree, why L1 is sparse (1-D thresholding vs shrinkage, constant vs vanishing pull, geometry),
# "s.t." constrained form. Dropped: style-03d-not-regularization (= Final 2025 Q12, pending until the neural-net lectures).

- id: style-03d-ridge-factor
  type: mcq
  origin: exam_style
  lecture: "03d"
  themes: [ridge]
  priority: core
  front: "*(Ridge)* What is the minimizer of $\\frac{1}{2N}\\|\\mathbf{y} - X\\mathbf{w}\\|^2 + \\lambda\\|\\mathbf{w}\\|^2$ (with $\\lambda > 0$)?"
  choices:
    - '$(X^\top X + 2N\lambda I)^{-1}X^\top\mathbf{y}$'
    - '$(X^\top X + \lambda I)^{-1}X^\top\mathbf{y}$'
    - '$(X^\top X + N\lambda I)^{-1}X^\top\mathbf{y}$'
    - '$(X^\top X + \frac{\lambda}{2N} I)^{-1}X^\top\mathbf{y}$'
  answer: [0]
  explanation: |
    Gradient $= -\frac1N X^\top(\mathbf{y} - X\mathbf{w}) + 2\lambda\mathbf{w}$; multiplying the optimality condition by $N$ gives $(X^\top X + 2N\lambda I)\mathbf{w} = X^\top\mathbf{y}$,
    i.e. $\lambda' = 2N\lambda$. $(X^\top X + \lambda I)^{-1}X^\top\mathbf{y}$ is the minimizer of $\frac12\|\mathbf{y} - X\mathbf{w}\|^2 + \frac\lambda2\|\mathbf{w}\|^2$, not of this cost.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 6, label: "03d slide 6 (annotated)"}
  added: 2026-10-02

- id: style-03d-l2-pull-vanishes
  type: tf
  origin: exam_style
  lecture: "03d"
  themes: [ridge, lasso]
  priority: core
  front: "*(Ridge vs lasso)* The shrinking force that the L2 penalty $\\lambda\\|\\mathbf{w}\\|_2^2$ exerts on a weight $w_i$ becomes weaker as $w_i$ approaches 0."
  answer: true
  explanation: |
    $\frac{\partial}{\partial w_i}\lambda w_i^2 = 2\lambda w_i \to 0$: the pull vanishes near 0, so weights are shrunk but not set to exactly 0. The L1 pull
    $\lambda\operatorname{sign}(w_i)$ keeps a constant magnitude, which is why lasso produces exact zeros.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 5, label: "03d slide 4 (annotated)"}
  added: 2026-10-02

- id: style-03d-lambda-vs-degree
  type: tf
  origin: exam_style
  lecture: "03d"
  also_lectures: ["03b"]
  themes: [ridge, overfitting, polynomial-features]
  priority: core
  front: "*(Model complexity)* Increasing the polynomial degree $M$ and increasing the ridge parameter $\\lambda$ both push the model towards overfitting."
  answer: false
  explanation: |
    They act in **opposite** directions: a larger degree $M$ enlarges the model family (towards overfitting, 03b slide 6), a larger $\lambda$
    penalizes complexity more (towards underfitting, weights pushed to 0). Small $\lambda$ (→ least squares) ⇒ overfitting risk.
  trap: "Large λ ⇒ underfit; large degree ⇒ overfit."
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03b_overfitting_annotated.pdf, page: 7, label: "03b slide 6 (annotated)"}
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 5, label: "03d slide 4 (annotated)"}
  added: 2026-10-11

- id: style-03d-weight-decay-step
  type: mcq
  origin: exam_style
  lecture: "03d"
  themes: [ridge, gradient-descent]
  priority: core
  front: "*(Weight decay)* One gradient-descent step with step-size $\\gamma$ on $\\mathcal{L}(\\mathbf{w}) + \\lambda\\|\\mathbf{w}\\|_2^2$ gives:"
  choices:
    - "$\\mathbf{w} \\leftarrow (1 - 2\\gamma\\lambda)\\,\\mathbf{w} - \\gamma\\nabla\\mathcal{L}(\\mathbf{w})$"
    - "$\\mathbf{w} \\leftarrow (1 - \\gamma\\lambda)\\,\\mathbf{w} - \\gamma\\nabla\\mathcal{L}(\\mathbf{w})$"
    - "$\\mathbf{w} \\leftarrow \\mathbf{w} - \\gamma\\nabla\\mathcal{L}(\\mathbf{w}) - \\gamma\\lambda\\operatorname{sign}(\\mathbf{w})$"
    - "$\\mathbf{w} \\leftarrow (1 + 2\\gamma\\lambda)\\,\\mathbf{w} - \\gamma\\nabla\\mathcal{L}(\\mathbf{w})$"
  answer: [0]
  explanation: |
    $\nabla(\lambda\|\mathbf{w}\|^2) = 2\lambda\mathbf{w}$, so each step also multiplies $\mathbf{w}$ by $(1 - 2\gamma\lambda)$: the weights "decay" towards 0
    (03d slide 4: $-\nabla\Omega = -2\lambda\mathbf{w}$, weight decay). $(1-\gamma\lambda)$ forgets the factor 2 (it is the step for $\frac\lambda2\|\mathbf{w}\|^2$);
    the $\operatorname{sign}$ version is the L1 (lasso) subgradient step; $(1 + 2\gamma\lambda)$ has the wrong sign.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 5, label: "03d slide 4 (annotated)"}
  added: 2026-10-11

- id: style-03d-ridge-biased
  type: tf
  origin: exam_style
  lecture: "03d"
  themes: [ridge, bias-variance]
  priority: core
  front: "*(Ridge)* If $\\mathbf{y} = X\\mathbf{w}^\\star + \\boldsymbol\\varepsilon$ with zero-mean noise, the ridge estimator with $\\lambda > 0$ is biased: $\\mathbb{E}[\\hat{\\mathbf{w}}_\\lambda] \\ne \\mathbf{w}^\\star$ in general."
  answer: true
  explanation: |
    $\hat{\mathbf{w}}_\lambda = (X^\top X + \lambda' I)^{-1}X^\top\mathbf{y}$, so $\mathbb{E}[\hat{\mathbf{w}}_\lambda] = (X^\top X + \lambda' I)^{-1}X^\top X\,\mathbf{w}^\star$, which differs
    from $\mathbf{w}^\star$ for $\lambda' > 0$ (shrinkage towards 0). Least squares ($\lambda = 0$, $X^\top X$ invertible) is unbiased. Final 2025 Q43
    (open question); ridge trades this bias for a smaller variance (Final 2022 Q6, lecture 04b).
  sources:
    - {kind: exam, pdf: exam/final-exam-2025-solutions.pdf, page: 18, label: "Final 2025 Q43"}
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 6, label: "03d slide 6 (annotated)"}
  added: 2026-10-11

- id: style-03d-thresholding-vs-shrinkage
  type: mcq
  origin: exam_style
  lecture: "03d"
  themes: [lasso, ridge]
  priority: core
  front: |
    *(Why L1 is sparse, 1-D)* With $a = 0.5$ and $\lambda = 1$: what are the minimizers of the lasso problem $\frac12(w - a)^2 + \lambda|w|$
    and of the ridge problem $\frac12(w - a)^2 + \lambda w^2$, in this order?
  choices: ["$0$ and $1/6$", "$1/6$ and $0$", "$0$ and $0.25$", "$-0.5$ and $1/6$"]
  answer: [0]
  explanation: |
    Lasso = soft-thresholding: $w^\star = \operatorname{sign}(a)\max(|a| - \lambda, 0) = 0$ since $|a| \le \lambda$ (exactly zero). Ridge: $w - a + 2\lambda w = 0$
    ⇒ $w^\star = a/(1 + 2\lambda) = 1/6$ (shrunk, never exactly 0 for $a \ne 0$). $0.25 = a/(1+\lambda)$ forgets the factor 2; $-0.5 = a - \lambda$
    forgets the $\max(\cdot, 0)$.
  trap: "L1 sets small coefficients exactly to 0; L2 only shrinks them."
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 10, label: "03d slide 10 (annotated)"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 34, label: "02a slide 34 (subgradients)"}
  added: 2026-10-11
  notes: "Soft-thresholding follows from the subgradient optimality condition 0 ∈ w − a + λ∂|w| (not written on the slides)."

- id: style-03d-l1-geometry
  type: mcq
  origin: exam_style
  lecture: "03d"
  themes: [lasso]
  priority: core
  front: "*(Lasso, geometric view)* Why does the L1 penalty tend to produce sparse solutions?"
  choices:
    - "The error level sets (ellipsoids centred at $\\mathbf{w}_\\text{LS}$) most likely first touch the L1 ball at a corner, which lies on a coordinate axis."
    - "The L1 ball is round, so the solution is pushed towards the origin in every direction."
    - "The error level sets are centred at the origin, where all weights are zero."
    - "The L1 penalty is differentiable everywhere, so gradient descent reaches zero exactly."
  answer: [0]
  explanation: |
    03d slides 10–12: the optimum is where the smallest error ellipsoid (all centred at $\mathbf{w}_\text{LS}$) touches the diamond-shaped L1 ball;
    this is more likely at a corner, where some $w_i = 0$. The **L2** ball is round (no corners), hence no sparsity; the level sets are
    centred at $\mathbf{w}_\text{LS}$, not at 0; $|w|$ is **not** differentiable at 0 — that kink is what allows exact zeros.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 11, label: "03d slide 11 (annotated)"}
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 12, label: "03d slide 12 (annotated)"}
  added: 2026-10-11

- id: style-03d-constrained-form
  type: tf
  origin: exam_style
  lecture: "03d"
  themes: [lasso, constrained-optimization]
  priority: core
  front: "*(Lasso as a constraint)* The lasso is similar to $\\min_\\mathbf{w} \\mathcal{L}(\\mathbf{w})$ s.t. $\\|\\mathbf{w}\\|_1 \\le \\tau$, where a larger penalty $\\lambda$ corresponds to a smaller budget $\\tau$."
  answer: true
  explanation: |
    03d slides 15–16: ridge and lasso are similar to constrained problems ("s.t." = subject to) with $\|\mathbf{w}\|_2^2 \le \tau$ resp. $\|\mathbf{w}\|_1 \le \tau$.
    A stronger penalty allows less weight norm, i.e. a smaller $\tau$; $\lambda \to 0$ corresponds to $\tau$ large enough to contain $\mathbf{w}_\text{LS}$.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 15, label: "03d slide 15"}
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 16, label: "03d slide 16"}
  added: 2026-10-11
  notes: "The λ ↔ τ direction is standard (Lagrangian view), not written on the slides."

- id: style-03d-lasso-closed-form
  type: tf
  origin: exam_style
  lecture: "03d"
  themes: [lasso, subgradients]
  priority: core
  front: "*(Lasso)* Like ridge regression, the lasso has a closed-form solution obtained by setting its gradient to zero and solving a linear system."
  answer: false
  explanation: |
    $\lambda\|\mathbf{w}\|_1$ is not differentiable where some $w_i = 0$ — exactly where lasso solutions live. In general there is no closed form:
    it is solved iteratively, e.g. with subgradient methods (02a). Ridge keeps a differentiable quadratic cost, hence the linear system
    $(X^\top X + \lambda' I)\mathbf{w} = X^\top\mathbf{y}$ (03d slide 6).
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 10, label: "03d slide 10 (annotated)"}
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 6, label: "03d slide 6 (annotated)"}
  added: 2026-10-11
  notes: "The 1-D / orthogonal-design special cases do have closed forms (soft-thresholding); the claim is about the general case."
