# Lecture 04b — Bias–Variance Decomposition (Flammarion deck, almost no printed numbers → labels use the PDF page, "04b p. N").
# Written in S5 (2026-10-02); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# Officials in exams/04b.yaml cover: bias / variance / noise definitions and "noise is the only algorithm-independent term"
# (2025 Q25), the decomposition formula (2023 Q11), ridge vs OLS (2022 Q6), high bias ⇏ low variance (2022 Q27), quadratic vs
# constant model (2021 Q4), training error vs σ² (2021 Q26), weakly data-dependent algorithm (2016 Q8), simple / complex
# models (mock 2018 5a–5b). Dropped: double descent (never asked), the term-by-term formula cards (cheat sheet).

- id: style-04b-more-data-high-bias
  type: tf
  origin: exam_style
  lecture: "04b"
  themes: [bias-variance]
  priority: core
  front: |
    *(Learning curves)* The training and test errors of a model have both converged to the same high value as the training set grew.
    Collecting more training data will substantially lower the test error.
  answer: false
  explanation: "Curves meeting at a high plateau = **high bias**: the model class is too simple. More data does not help; a richer model (or smaller λ) does."
  sources:
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 31, label: "04b p. 31"}
  added: 2026-10-02

- id: style-04b-error-below-bias
  type: tf
  origin: exam_style
  lecture: "04b"
  themes: [bias-variance]
  priority: core
  front: "*(Bias–variance)* Under the square loss, the expected error $\\mathbb{E}_{S,\\varepsilon}[(f(x_0) + \\varepsilon - f_S(x_0))^2]$ can be smaller than the bias term at $x_0$ if the variance is small enough."
  answer: false
  explanation: "The three terms are non-negative, so each one (bias² included) is a lower bound on the expected error. A small variance cannot compensate a large bias."
  sources:
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 22, label: "04b p. 22"}
  added: 2026-10-02

- id: style-04b-cross-term-reason
  type: tf
  origin: exam_style
  lecture: "04b"
  themes: [bias-variance]
  priority: core
  front: |
    *(Bias–variance)* In the derivation, $\mathbb{E}_{S,\varepsilon}[\varepsilon(f(x_0) - f_S(x_0))] = 0$ because the noise $\varepsilon$ is independent of $x_0$.
  answer: false
  explanation: |
    $x_0$ is fixed. The term vanishes because $\varepsilon$ is independent of the **training set** $S$ (so the expectation factorizes) **and** $\mathbb{E}[\varepsilon] = 0$.
  sources:
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 20, label: "04b p. 20"}
  added: 2026-10-02

- id: style-04b-lambda-infinity
  type: tf
  origin: exam_style
  lecture: "04b"
  also_lectures: ["03d"]
  themes: [bias-variance, ridge]
  priority: core
  front: "*(Ridge, bias–variance)* In ridge regression, as $\\lambda \\to \\infty$ the variance term tends to $0$."
  answer: true
  explanation: |
    $\lambda \to \infty$ forces $\mathbf{w} \to 0$ whatever the training set, so the predictor becomes the constant $0$: no variability across $S$
    (zero variance), but a large bias $f(x_0)^2$ — underfitting.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03d_ridge_annotated.pdf, page: 5, label: "03d slide 4 (annotated)"}
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 22, label: "04b p. 22"}
  added: 2026-10-02

- id: style-04b-more-data-high-variance
  type: tf
  origin: exam_style
  lecture: "04b"
  themes: [bias-variance, overfitting]
  priority: core
  front: "*(Learning curves)* The training error is low, the test error is much higher and still decreasing as the training set grows. Collecting more training data is likely to help."
  answer: true
  explanation: |
    A large train/test gap with a test curve still going down is the high-**variance** (overfitting) signature: more data reduces the variance
    and closes the gap (03b slide 8). When both curves have met at a high plateau (high bias), more data is useless — change the model.
    04b p. 31 recommends drawing such learning curves (error vs training-set size).
  trap: "More data cures variance, not bias."
  sources:
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 31, label: "04b p. 31"}
    - {kind: lecture, pdf: lectures/03/lecture03b_overfitting_annotated.pdf, page: 9, label: "03b slide 8 (annotated)"}
  added: 2026-10-11
  notes: "Reading of learning curves (gap ⇒ variance, high plateau ⇒ bias) is standard; 04b p. 31 only says to draw them."

- id: style-04b-not-realizable
  type: tf
  origin: exam_style
  lecture: "04b"
  themes: [bias-variance]
  priority: core
  front: "*(Data model)* In the bias–variance setting $y = f(x) + \\varepsilon$, saying that the model is \"not realizable\" means that the true function $f$ cannot be computed in practice."
  answer: false
  explanation: |
    04b p. 15: "not realizable" means **$f$ is not in our model class** (e.g. a cubic $f$ fitted with lines). Then even the best function of the
    class differs from $f$, which shows up as bias. (That $f$ is unknown is a separate fact.)
  sources:
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 15, label: "04b p. 15"}
  added: 2026-10-11

- id: style-04b-bias-variance-compute
  type: mcq
  origin: exam_style
  lecture: "04b"
  themes: [bias-variance]
  priority: core
  front: |
    *(Bias–variance)* At $x_0$ the true value is $f(x_0) = 2$. Over four equally likely training sets the algorithm predicts
    $f_S(x_0) = 1, 2, 3, 2$. What are the bias² and the variance at $x_0$?
  choices:
    - "bias² $= 0$, variance $= 0.5$"
    - "bias² $= 0.5$, variance $= 0$"
    - "bias² $= 0$, variance $= 2$"
    - "bias² $= 0.5$, variance $= 0.5$"
  answer: [0]
  explanation: |
    Average prediction $\mathbb{E}_S[f_S(x_0)] = 2$, so bias² $= (2 - 2)^2 = 0$. Variance $= \mathbb{E}_S[(f_S(x_0) - 2)^2] = (1 + 0 + 1 + 0)/4 = 0.5$
    (04b p. 22). Bias compares the **average** prediction with the truth (individual errors cancel); variance is the spread around that average.
    $2$ is the sum of squared deviations without dividing by 4; the swapped option confuses the two terms.
  sources:
    - {kind: lecture, pdf: lectures/04/lecture04b.pdf, page: 22, label: "04b p. 22"}
  added: 2026-10-11
