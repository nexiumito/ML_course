# Lecture 01c — Loss Functions (Jaggi deck: printed slide N = PDF page N+1 up to slide 9; no slide 10, so slides 11–16 = pages 11–16).
# Written in S3 (2026-10-02); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# Note: this lecture defines MSE with 1/N; labs / P1 / lecture 02a use 1/(2N) (same minimizer).
# Officials in exams/01c.yaml cover: MAE for a bounded target (2025 Q4), MAE minimizer = median (2024 Q5), MSE/MAE orderings
# (2023 Q1–Q2), MAE more robust (2023 Q18, 2019 Q16, 2016 Q3), MSE not convex for every model (2020 Q18).

- id: style-01c-mse-outlier-fit
  type: mcq
  origin: exam_style
  lecture: "01c"
  themes: [loss-functions]
  priority: core
  front: |
    *(Loss functions)* We fit a constant model $f(x) = w_0$ to the targets $y = (1, 2, 3, 4, 20)$ by minimizing the MSE. Which $w_0$ do we obtain?
  choices: ["$6$", "$3$", "$2.5$", "$20$"]
  answer: [0]
  explanation: |
    The MSE of a constant model is minimized by the mean: $(1+2+3+4+20)/5 = 6$. $3$ is the median (the MAE solution), $2.5$ the mean
    without the outlier, and $20$ the outlier itself.
  trap: "MSE → mean (dragged by outliers); MAE → median."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 7, label: "01c slide 6 (annotated)"}
  added: 2026-10-02

- id: style-01c-mae-differentiable
  type: tf
  origin: exam_style
  lecture: "01c"
  themes: [loss-functions, subgradients]
  priority: core
  front: "*(Loss functions)* For a linear model, the MAE is a convex and everywhere differentiable function of $\\mathbf{w}$."
  answer: false
  explanation: |
    Convex yes, but not differentiable: $|e|$ has a kink at $e = 0$, so wherever a residual $y_n - \mathbf{x}_n^\top\mathbf{w}$ vanishes the MAE has a kink.
    Gradient methods are replaced by subgradient methods (lecture 02a).
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 10, label: "01c slide 9 (annotated)"}
  added: 2026-10-02

- id: style-01c-robust-convex
  type: tf
  origin: exam_style
  lecture: "01c"
  themes: [loss-functions, convexity]
  priority: core
  front: "*(Loss functions)* A loss that stays bounded for very large residuals, such as Tukey's bisquare loss, is convex."
  answer: false
  explanation: |
    A bounded (flattening) loss cannot be convex unless it is constant: that is exactly the statistical vs computational trade-off.
    Tukey's loss is very robust but non-convex; Huber and MAE grow linearly and stay convex.
  trap: "More robust ⇒ often non-convex."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 14, label: "01c slide 14 (annotated)"}
  added: 2026-10-02

- id: style-01c-convex-unique-min
  type: tf
  origin: exam_style
  lecture: "01c"
  themes: [convexity]
  priority: core
  front: "*(Convexity)* Every strictly convex function $h:\\mathbb{R}^D\\to\\mathbb{R}$ that has a minimum has exactly one global minimizer."
  answer: true
  explanation: |
    If $\mathbf{u} \ne \mathbf{v}$ were both global minimizers with value $m$, strict convexity would give $h(\frac{\mathbf{u}+\mathbf{v}}{2}) < m$, a contradiction.
    (Without strictness, e.g. a flat-bottomed convex function, the minimizer need not be unique.)
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions.pdf, page: 12, label: "01c slide 12"}
  added: 2026-10-02

- id: style-01c-mse-linear-convex
  type: tf
  origin: exam_style
  lecture: "01c"
  themes: [loss-functions, convexity]
  priority: core
  front: "*(Convexity)* For a linear model $f_\\mathbf{w}(\\mathbf{x}) = \\mathbf{x}^\\top\\mathbf{w}$, the MSE $\\frac1N\\sum_n (y_n - \\mathbf{x}_n^\\top\\mathbf{w})^2$ is convex in $\\mathbf{w}$."
  answer: true
  explanation: |
    Each term is a convex function (the square) of an affine function of $\mathbf{w}$, hence convex; a sum of convex functions is convex
    (01c slide 12). The same argument works for the MAE. For a **non-linear** model (e.g. a neural network) the MSE need not be convex
    in the weights (Final 2020 Q18).
  trap: "Convex in w for a linear model only — not for every model."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions.pdf, page: 12, label: "01c slide 12"}
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 13, label: "01c slide 13 (annotated)"}
  added: 2026-10-11

- id: style-01c-half-factor
  type: tf
  origin: exam_style
  lecture: "01c"
  also_lectures: ["02a"]
  themes: [loss-functions, linear-regression]
  priority: core
  front: "*(MSE conventions)* $\\frac1N\\sum_n (y_n - \\mathbf{x}_n^\\top\\mathbf{w})^2$ (lecture 01c) and $\\frac1{2N}\\sum_n (y_n - \\mathbf{x}_n^\\top\\mathbf{w})^2$ (labs, lecture 02a) have the same minimizer, but their gradients differ by a factor 2."
  answer: true
  explanation: |
    Multiplying a function by a positive constant does not move its minimizer. The $\frac12$ only cancels the 2 of the derivative:
    with $\frac1{2N}$, $\nabla\mathcal{L} = -\frac1N\mathbf{X}^\top(\mathbf{y} - \mathbf{X}\mathbf{w})$; with $\frac1N$ it is twice that. So gradient
    formulas, and step sizes, depend on the convention: check which one an exam question uses.
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 6, label: "01c slide 5 (annotated)"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 16, label: "02a slide 15 (annotated)"}
  added: 2026-10-11
