- id: 01c-convexity-definition
  type: cloze
  origin: concept
  lecture: "01c"
  themes: [convexity]
  priority: core
  front: |
    *(Convexity)* $h:\mathbb{R}^D \to \mathbb{R}$ is convex if for all $\mathbf{u}, \mathbf{v} \in \mathbb{R}^D$ and all $0 \le \lambda \le 1$:

    $h(\lambda\mathbf{u} + (1-\lambda)\mathbf{v}) \le$ {{c1::$\lambda h(\mathbf{u}) + (1-\lambda) h(\mathbf{v})$}}

    It is **strictly** convex if {{c2::the inequality is strict}}.
  explanation: "Geometrically: the segment between any two points of the graph lies above the graph."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 11, label: "01c slide 11 (annotated)"}
  added: 2026-10-02

- id: 01c-convexity-minima
  type: cloze
  origin: concept
  lecture: "01c"
  themes: [convexity, optimization]
  priority: core
  front: |
    *(Convexity)* A **strictly** convex function has {{c1::a unique global minimum $\mathbf{w}^\star$}}.
    For a convex function, every local minimum is {{c2::a global minimum}}.
  trap: "Convex alone does not give uniqueness (e.g. a flat valley); strict convexity does (Final 2020 Q28)."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions.pdf, page: 12, label: "01c slide 12"}
  added: 2026-10-02

- id: 01c-mse-linear-convex
  type: basic
  origin: concept
  lecture: "01c"
  themes: [convexity, linear-regression]
  priority: core
  front: "*(Convexity)* Why is the MSE of a linear model convex in $\\mathbf{w}$?"
  back: |
    Each term $(y_n - \mathbf{x}_n^\top\mathbf{w})^2$ is a convex function (square) of an affine function of $\mathbf{w}$, hence convex in $\mathbf{w}$;
    and **sums of convex functions are convex**.
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions.pdf, page: 12, label: "01c slide 12"}
  added: 2026-10-02

- id: 01c-mae-linear-convex-proof
  type: basic
  origin: concept
  lecture: "01c"
  themes: [convexity, linear-regression]
  priority: core
  front: "*(Exercise)* Prove that fitting a linear model $f_\\mathbf{w}(\\mathbf{x}) = \\mathbf{x}^\\top\\mathbf{w}$ with the MAE is convex in $\\mathbf{w}$."
  back: |
    1. $|\cdot|$ is convex on $\mathbb{R}$.
    2. $\mathbf{w} \mapsto y_n - \mathbf{x}_n^\top\mathbf{w}$ is affine, and convex ∘ affine is convex (plug $\lambda\mathbf{u}+(1-\lambda)\mathbf{v}$ into the definition).
    3. $\mathcal{L}(\mathbf{w}) = \frac1N\sum_n |y_n - \mathbf{x}_n^\top\mathbf{w}|$ is a non-negative sum of convex functions ⇒ convex.
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 13, label: "01c slide 13 (annotated)"}
  added: 2026-10-02

- id: 01c-robust-loss-family
  type: basic
  origin: concept
  lecture: "01c"
  themes: [loss-functions, convexity]
  priority: detail
  front: "*(Breheny plot, slide 14)* Rank least squares, absolute value, Huber and Tukey by robustness; which one is non-convex?"
  back: |
    Robustness: least squares < Huber ≈ absolute value < Tukey. Tukey's loss flattens out for large residuals (very robust) and is the only **non-convex** one.
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 14, label: "01c slide 14 (annotated)"}
  added: 2026-10-02

- id: 01c-huber-loss
  type: cloze
  origin: concept
  lecture: "01c"
  themes: [loss-functions]
  priority: detail
  front: |
    *(Additional reading)* Huber loss: $\frac12 e^2$ if $|e| \le \delta$, and {{c1::$\delta|e| - \frac12\delta^2$}} otherwise.
    It is {{c2::convex, differentiable and robust to outliers}}; its drawback is {{c3::that $\delta$ is hard to set}}.
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions.pdf, page: 15, label: "01c slide 15 (additional reading)"}
  added: 2026-10-02
  notes: "Huber formula: standard definition, matches the slide image (verified 2026-10-02)."

# ---------------------------------------------------------------- unofficial exam-style

- id: style-01c-mse-outlier-fit
  type: mcq
  origin: exam_style
  lecture: "01c"
  themes: [loss-functions]
  priority: core
  front: |
    *(Loss functions)* We fit a constant model $f(x) = w_0$ to the targets $y = (1, 2, 3, 4, 20)$ by minimizing the MSE. Which $w_0$ do we obtain?
  choices: ["$6$", "$3$", "$2.5$", "$20$"]
  answer: [0]
  explanation: |
    The MSE of a constant model is minimized by the mean: $(1+2+3+4+20)/5 = 6$. $3$ is the median (the MAE solution), $2.5$ the mean
    without the outlier, and $20$ the outlier itself.
  trap: "MSE → mean (dragged by outliers); MAE → median."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 7, label: "01c slide 6 (annotated)"}
  added: 2026-10-02

- id: style-01c-mae-differentiable
  type: tf
  origin: exam_style
  lecture: "01c"
  themes: [loss-functions, subgradients]
  priority: core
  front: "*(Loss functions)* For a linear model, the MAE is a convex and everywhere differentiable function of $\\mathbf{w}$."
  answer: false
  explanation: |
    Convex yes, but not differentiable: $|e|$ has a kink at $e = 0$, so wherever a residual $y_n - \mathbf{x}_n^\top\mathbf{w}$ vanishes the MAE has a kink.
    Gradient methods are replaced by subgradient methods (lecture 02a).
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 10, label: "01c slide 9 (annotated)"}
  added: 2026-10-02

- id: style-01c-robust-convex
  type: tf
  origin: exam_style
  lecture: "01c"
  themes: [loss-functions, convexity]
  priority: core
  front: "*(Loss functions)* A loss that stays bounded for very large residuals, such as Tukey's bisquare loss, is convex."
  answer: false
  explanation: |
    A bounded (flattening) loss cannot be convex unless it is constant: that is exactly the statistical vs computational trade-off.
    Tukey's loss is very robust but non-convex; Huber and MAE grow linearly and stay convex.
  trap: "More robust ⇒ often non-convex."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions_annotated.pdf, page: 14, label: "01c slide 14 (annotated)"}
  added: 2026-10-02

- id: style-01c-convex-unique-min
  type: tf
  origin: exam_style
  lecture: "01c"
  themes: [convexity]
  priority: core
  front: "*(Convexity)* Every strictly convex function $h:\\mathbb{R}^D\\to\\mathbb{R}$ that has a minimum has exactly one global minimizer."
  answer: true
  explanation: |
    If $\mathbf{u} \ne \mathbf{v}$ were both global minimizers with value $m$, strict convexity would give $h(\frac{\mathbf{u}+\mathbf{v}}{2}) < m$, a contradiction.
    (Without strictness, e.g. a flat-bottomed convex function, the minimizer need not be unique.)
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01c_loss_functions.pdf, page: 12, label: "01c slide 12"}
  added: 2026-10-02
