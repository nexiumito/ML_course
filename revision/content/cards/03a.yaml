# Lecture 03a — Least Squares (Jaggi deck; annotated PDF: slide N = page N+1).
# Written in S4 (2026-10-02); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# Officials in exams/03a.yaml cover: orthogonal design (2025 Q8), projection matrix (2025 Q32), adding a feature never
# increases training MSE (2025 Q40), d > n statements (2024 Q3), feature scaling / centering (2023 Q13–Q14), uniqueness for
# square X (2021 Q28), N ≤ D zero training error (2020 Q26). Dropped: definitions, the three convexity proofs, normal-equation
# derivations (cheat sheet), "convex ⇒ unique" (= Final 2020 Q28 in 02a).

- id: style-03a-error-orthogonal-y
  type: tf
  origin: exam_style
  lecture: "03a"
  themes: [least-squares]
  priority: core
  front: "*(Least squares)* At the least-squares solution $\\mathbf{w}^\\star$, the residual $\\mathbf{y} - X\\mathbf{w}^\\star$ is orthogonal to $\\mathbf{y}$."
  answer: false
  explanation: |
    The normal equations $X^\top(\mathbf{y} - X\mathbf{w}^\star) = 0$ say the residual is orthogonal to every **column of $X$**, hence to the fit $X\mathbf{w}^\star$.
    It is orthogonal to $\mathbf{y}$ only if $\mathbf{y} \in \operatorname{span}(X)$ (then the residual is $0$).
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03a_least_squares_annotated.pdf, page: 9, label: "03a slide 8 (annotated)"}
  added: 2026-10-02

- id: style-03a-duplicate-feature
  type: tf
  origin: exam_style
  lecture: "03a"
  themes: [least-squares]
  priority: core
  front: "*(Least squares)* If two columns of $X$ are identical (a duplicated feature), then $X^\\top X$ is singular, even when $N \\gg D$."
  answer: true
  explanation: |
    Duplicated columns ⇒ $X\mathbf{v} = 0$ for $\mathbf{v} = \mathbf{e}_i - \mathbf{e}_j \ne 0$ ⇒ $\operatorname{rank}(X) < D$ ⇒ $X^\top X$ singular, whatever $N$.
    (Nearly identical columns ⇒ ill-conditioned.)
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03a_least_squares_annotated.pdf, page: 12, label: "03a slide 11 (annotated)"}
  added: 2026-10-02

- id: style-03a-d-greater-n
  type: tf
  origin: exam_style
  lecture: "03a"
  themes: [least-squares]
  priority: core
  front: "*(Least squares)* If $D > N$, the normal equations $X^\\top X\\mathbf{w} = X^\\top\\mathbf{y}$ have no solution."
  answer: false
  explanation: |
    With $D > N$, $X^\top X$ is singular, so there are **infinitely many** solutions (not none). A linear-system solver still returns one of them;
    ridge regression picks a unique one.
  trap: "Singular Gram matrix ⇒ non-unique, not unsolvable."
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03a_least_squares_annotated.pdf, page: 12, label: "03a slide 11 (annotated)"}
  added: 2026-10-02

- id: style-03a-gram-pd
  type: tf
  origin: exam_style
  lecture: "03a"
  themes: [least-squares, convexity]
  priority: core
  front: "*(Least squares)* The Hessian $\\frac1N X^\\top X$ of the least-squares cost is positive **definite** if and only if $X$ has full column rank."
  answer: true
  explanation: |
    $\mathbf{v}^\top X^\top X\mathbf{v} = \|X\mathbf{v}\|^2 \ge 0$ always (PSD, so the cost is convex — 03a slide 6). It is $> 0$ for every
    $\mathbf{v} \ne 0$ iff $X\mathbf{v} \ne 0$ for every $\mathbf{v} \ne 0$, i.e. $\operatorname{rank}(X) = D$ (slide 10). Then the cost is strictly
    convex and $\mathbf{w}^\star$ is unique; with $D > N$ or duplicated features it is only PSD.
  trap: "Always PSD, positive definite only with full column rank."
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03a_least_squares_annotated.pdf, page: 7, label: "03a slide 6 (annotated)"}
    - {kind: lecture, pdf: lectures/03/lecture03a_least_squares_annotated.pdf, page: 11, label: "03a slide 10 (annotated)"}
  added: 2026-10-11

- id: style-03a-solve-cost
  type: mcq
  origin: exam_style
  lecture: "03a"
  themes: [least-squares]
  priority: core
  front: "*(Least squares)* With $X \\in \\mathbb{R}^{N \\times D}$, what is the cost of computing $\\mathbf{w}^\\star$ by forming $X^\\top X$ and solving the normal equations with a linear solver?"
  choices: ["$O(ND^2 + D^3)$", "$O(ND)$", "$O(N^3)$", "$O(N^2 D)$"]
  answer: [0]
  explanation: |
    Forming the $D \times D$ Gram matrix $X^\top X$ costs $O(ND^2)$ (as for the MSE Hessian, Final 2025 Q6), $X^\top\mathbf{y}$ costs $O(ND)$, and
    solving the $D \times D$ system (LU / QR, `np.linalg.solve`, never an explicit inverse — slide 13) costs $O(D^3)$. $O(ND)$ is one GD step;
    $O(N^3)$ and $O(N^2D)$ would come from the $N \times N$ matrix $XX^\top$, which least squares does not use.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03a_least_squares_annotated.pdf, page: 10, label: "03a slide 9 (annotated)"}
    - {kind: lecture, pdf: lectures/03/lecture03a_least_squares_annotated.pdf, page: 14, label: "03a slide 13 (annotated)"}
  added: 2026-10-11
  notes: "Operation counts are standard linear algebra (not written on the slides); O(ND²) for X^T X matches Final 2025 Q6."
