# Lecture 03c — Maximum Likelihood (Jaggi deck; annotated PDF: slide N = page N+1).
# Written in S4 (2026-10-02); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# Officials in exams/03c.yaml cover: Laplace noise ↔ MAE (2023 Q3), Gaussian noise ⇔ MSE condition (2020 Q1), MLE for a
# noisy binary variable (2019 Q20). Dropped: density formulas (cheat sheet), Fisher information / Cramér–Rao (never asked).

- id: style-03c-sigma-irrelevant
  type: tf
  origin: exam_style
  lecture: "03c"
  themes: [mle]
  priority: core
  front: "*(MLE)* In the model $y_n = \\mathbf{x}_n^\\top\\mathbf{w} + \\varepsilon_n$ with i.i.d. $\\varepsilon_n \\sim \\mathcal{N}(0, \\sigma^2)$, the maximum-likelihood estimate $\\mathbf{w}_\\text{MLE}$ depends on $\\sigma^2$."
  answer: false
  explanation: |
    $\mathcal{L}_\text{LL}(\mathbf{w}) = -\frac{1}{2\sigma^2}\sum_n (y_n - \mathbf{x}_n^\top\mathbf{w})^2 + \text{cnst}$: $\sigma^2$ only scales the objective (and enters the constant),
    so the maximizer is the least-squares solution whatever $\sigma^2$.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03c_maximum_likelihood_annotated.pdf, page: 7, label: "03c slide 6 (annotated)"}
  added: 2026-10-02

- id: style-03c-log-same-argmax
  type: tf
  origin: exam_style
  lecture: "03c"
  themes: [mle]
  priority: core
  front: "*(MLE)* Maximizing the likelihood $p(\\mathbf{y} \\mid X, \\mathbf{w})$ and maximizing the log-likelihood $\\log p(\\mathbf{y} \\mid X, \\mathbf{w})$ can give different $\\mathbf{w}$."
  answer: false
  explanation: |
    $\log$ is strictly increasing, so both have the same maximizers. The log is used because it turns the product over samples into a sum
    (easier to differentiate, numerically stable).
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03c_maximum_likelihood_annotated.pdf, page: 6, label: "03c slide 5 (annotated)"}
  added: 2026-10-02

- id: style-03c-independence-product
  type: tf
  origin: exam_style
  lecture: "03c"
  themes: [mle, probability]
  priority: core
  front: "*(MLE)* Writing the likelihood of the data as a product $\\prod_n p(y_n \\mid \\mathbf{x}_n, \\mathbf{w})$ relies on the noise terms being independent across samples."
  answer: true
  explanation: |
    Independent samples ⇒ the joint density factorizes into a product (slide 4: "independence"). The Gaussian form of each factor is the separate
    assumption on the noise distribution.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03c_maximum_likelihood_annotated.pdf, page: 5, label: "03c slide 4 (annotated)"}
  added: 2026-10-02

- id: style-03c-bernoulli-mle
  type: mcq
  origin: exam_style
  lecture: "03c"
  themes: [mle, probability]
  priority: core
  front: "*(MLE)* You observe $y = (0, 1, 1, 1)$, i.i.d. Bernoulli($p$). What is the maximum-likelihood estimate of $p$?"
  choices: ["$3/4$", "$1/2$", "$1$", "$1/4$"]
  answer: [0]
  explanation: |
    Likelihood $= \prod_n p^{y_n}(1-p)^{1-y_n} = p^3(1-p)$ (product over i.i.d. points). Log: $3\log p + \log(1-p)$; derivative
    $\frac3p - \frac1{1-p} = 0 \Rightarrow p = \frac34$, the fraction of ones. $1/2$ ignores the data, $1$ maximizes only the three factors $p$
    and forgets the $y = 0$ point, $1/4$ is the fraction of zeros.
  sources:
    - {kind: lecture, pdf: lectures/03/lecture03c_maximum_likelihood_annotated.pdf, page: 5, label: "03c slide 4 (annotated)"}
  added: 2026-10-11

- id: style-03c-uniform-mle
  type: mcq
  origin: exam_style
  lecture: "03c"
  themes: [mle, probability]
  priority: core
  front: "*(MLE)* $x_1, \\dots, x_5$ i.i.d. uniform on $[0, \\theta]$ (density $1/\\theta$ on $[0, \\theta]$), observed $\\{1, 3, 6, 3, 4\\}$. What is $\\hat\\theta_\\text{MLE}$?"
  choices: ["$6$", "$3.4$", "$6.8$", "$3$"]
  answer: [0]
  explanation: |
    Likelihood $\theta^{-5}\cdot 1[\theta \ge \max_i x_i]$: zero if $\theta < 6$ (a point would be impossible), then decreasing in $\theta$. Its
    derivative is never zero, so the maximum is at the boundary: $\hat\theta = \max_i x_i = 6$. $3.4$ is the mean, $6.8 = 2\bar x$ the
    moment estimator, $3$ the median — all ignore that $\theta$ must cover every observation.
  trap: "Setting the derivative to zero fails: the maximum is at the boundary θ = max xᵢ."
  sources:
    - {kind: exam, pdf: exam/final-exam-2025-solutions.pdf, page: 19, label: "Final 2025 Q45"}
    - {kind: lecture, pdf: lectures/03/lecture03c_maximum_likelihood_annotated.pdf, page: 5, label: "03c slide 4 (annotated)"}
  added: 2026-10-11
  notes: "Turned from the open question Final 2025 Q45 (same data, official answer θ̂ = max xᵢ = 6)."
