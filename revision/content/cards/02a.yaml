# Lecture 02a — Optimization (Jaggi deck; annotated PDF used for sources). Labs / this lecture use the MSE with 1/(2N).
# Written in S3 (2026-10-02); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# 23 officials in exams/02a.yaml already cover: MSE gradient (2025 Q5) and Hessian (2025 Q6, Q37), SGD unbiased (2025 Q31)
# and number of updates (2019 Q23), GD step / direction / step-size range (2024 Q38, 2023 Q4, 2022 Q4), grid search vs GD vs
# SGD cost (2020 Q5), subgradient existence / uniqueness (2022 Q24, 2020 Q6, 2018 P10, 2017 P13), convex sets and
# compositions (2019 Q17–Q19, 2017 P14, mock 2018 5j), unique minimizers / maximizers (2020 Q28, 2021 Q6, 2017 P2, 2016 Q4),
# quadratic-form gradient (2021 Q5). Dropped: definitions, grid search, GD 1-D step sizes (= 2022 Q4), SignSGD / Muon,
# constrained optimization (projections, penalties: never asked).

- id: style-02a-sgd-step-cost
  type: mcq
  origin: exam_style
  lecture: "02a"
  themes: [sgd]
  priority: core
  front: "*(SGD)* For linear regression with the MSE on $N$ samples in dimension $D$, what is the cost of one SGD step (one sample)?"
  choices: ["$O(D)$", "$O(N)$", "$O(ND)$", "$O(ND^2)$"]
  answer: [0]
  explanation: |
    $\nabla\mathcal{L}_n = -\mathbf{x}_n(y_n - \mathbf{x}_n^\top\mathbf{w})$: one inner product and one scaled vector, $O(D)$. $O(ND)$ is a full GD step;
    $O(ND^2)$ is the cost of the Hessian $\frac1N X^\top X$.
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 24, label: "02a slide 23 (annotated)"}
  added: 2026-10-02

- id: style-02a-minibatch-full
  type: tf
  origin: exam_style
  lecture: "02a"
  themes: [sgd]
  priority: core
  front: "*(SGD)* Mini-batch SGD with batch size $|B| = N$ (the whole training set, without replacement) is exactly gradient descent."
  answer: true
  explanation: "$\\mathbf{g} = \\frac1N\\sum_{n=1}^N\\nabla\\mathcal{L}_n(\\mathbf{w}) = \\nabla\\mathcal{L}(\\mathbf{w})$, the full gradient. $|B| = 1$ is basic SGD."
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 22, label: "02a slide 21 (annotated)"}
  added: 2026-10-02

- id: style-02a-critical-point-min
  type: tf
  origin: exam_style
  lecture: "02a"
  themes: [optimization]
  priority: core
  front: "*(Optimality)* If $\\nabla\\mathcal{L}(\\mathbf{w}) = 0$, then $\\mathbf{w}$ is a local minimum of $\\mathcal{L}$."
  answer: false
  explanation: |
    $\nabla\mathcal{L} = 0$ is only **necessary**: $\mathbf{w}$ could be a local maximum or a saddle point (e.g. $\mathcal{L}(w) = -w^2$ or $w^3$ at 0).
    It becomes sufficient with convexity (then global) or with a positive definite Hessian (then local).
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 38, label: "02a slide 38 (annotated)"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 39, label: "02a slide 39 (annotated)"}
  added: 2026-10-02

- id: style-02a-normalization
  type: tf
  origin: exam_style
  lecture: "02a"
  themes: [gradient-descent]
  priority: core
  front: "*(GD)* Normalizing the input features can make gradient descent converge faster on an ill-conditioned least-squares problem."
  answer: true
  explanation: |
    Features on very different scales give elongated level sets (ill-conditioning): GD zig-zags and the step-size is limited by the steepest
    direction. Normalization (pre-conditioning) rounds the level sets so GD heads straight to the minimum.
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 37, label: "02a slide 37 (annotated)"}
  added: 2026-10-02

- id: style-02a-mae-subgradient
  type: mcq
  origin: exam_style
  lecture: "02a"
  themes: [subgradients, loss-functions]
  priority: core
  front: "*(Subgradients)* Which vector is a subgradient of the linear MAE $\\mathcal{L}(\\mathbf{w}) = \\frac1N\\sum_n |y_n - \\mathbf{x}_n^\\top\\mathbf{w}|$ at $\\mathbf{w}$?"
  choices:
    - "$-\\frac1N\\mathbf{X}^\\top\\operatorname{sign}(\\mathbf{y} - \\mathbf{X}\\mathbf{w})$"
    - "$\\frac1N\\mathbf{X}^\\top\\operatorname{sign}(\\mathbf{y} - \\mathbf{X}\\mathbf{w})$"
    - "$-\\frac1N\\mathbf{X}^\\top(\\mathbf{y} - \\mathbf{X}\\mathbf{w})$"
    - "$-\\frac1N\\operatorname{sign}\\big(\\mathbf{X}^\\top(\\mathbf{y} - \\mathbf{X}\\mathbf{w})\\big)$"
  answer: [0]
  explanation: |
    Chain rule for subgradients (02a slide 34): $h = |\cdot|$ with $\operatorname{sign}(e) \in \partial|e|$ (any value in $[-1,1]$ at $e = 0$), and
    $q(\mathbf{w}) = y_n - \mathbf{x}_n^\top\mathbf{w}$ has $\nabla q = -\mathbf{x}_n$; average over $n$. The second option has the wrong sign (an ascent
    direction), the third is the MSE gradient, the last applies the sign after summing instead of to each residual.
  trap: "The minus sign comes from the derivative of y − xᵀw with respect to w."
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 34, label: "02a slide 34 (annotated)"}
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization.pdf, page: 35, label: "02a slide 35"}
  added: 2026-10-11

- id: style-02a-subgradient-differentiable
  type: tf
  origin: exam_style
  lecture: "02a"
  themes: [subgradients, convexity]
  priority: core
  front: "*(Subgradients)* A convex function that is differentiable at $\\mathbf{w}$ can have several subgradients at $\\mathbf{w}$."
  answer: false
  explanation: |
    For a convex $\mathcal{L}$ differentiable at $\mathbf{w}$, the subdifferential is $\{\nabla\mathcal{L}(\mathbf{w})\}$: the tangent plane is the only
    linear lower bound touching the graph there (02a slide 32). Several subgradients appear only at kinks (e.g. $\partial|e|$ at $e = 0$ is
    $[-1, 1]$). For a non-convex function, a subgradient may not exist at all, even where it is differentiable ($-x^2$ at 0, Final 2020 Q6).
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 32, label: "02a slide 32 (annotated)"}
  added: 2026-10-11

- id: style-02a-second-order
  type: mcq
  origin: exam_style
  lecture: "02a"
  themes: [optimization]
  priority: core
  front: "*(Optimality)* At a point $\\mathbf{w}$ where $\\nabla\\mathcal{L}(\\mathbf{w}) = 0$ and the Hessian $\\nabla^2\\mathcal{L}(\\mathbf{w})$ is positive definite, $\\mathbf{w}$ is:"
  choices:
    - "a strict local minimum"
    - "a global minimum"
    - "a saddle point"
    - "possibly a local maximum"
  answer: [0]
  explanation: |
    Second-order sufficient condition (02a slide 39): critical point + positive definite Hessian ⇒ (strict) **local** minimum. It is global
    only with more structure (e.g. $\mathcal{L}$ convex). A saddle needs eigenvalues of both signs, a maximum a negative semi-definite Hessian.
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 39, label: "02a slide 39 (annotated)"}
  added: 2026-10-11

- id: style-02a-hessian-psd-convex
  type: tf
  origin: exam_style
  lecture: "02a"
  themes: [convexity]
  priority: core
  front: "*(Convexity)* A twice-differentiable function $\\mathcal{L} : \\mathbb{R}^D \\to \\mathbb{R}$ whose Hessian is positive semi-definite at every point is convex."
  answer: true
  explanation: |
    02a slide 39: twice-differentiable $\mathcal{L}$ is convex **iff** $\nabla^2\mathcal{L}(\mathbf{w}) \succeq 0$ for all $\mathbf{w}$ (the multi-D analogue of
    $f'' \ge 0$). This is how the linear MSE ($\frac1N\mathbf{X}^\top\mathbf{X} \succeq 0$) and the logistic loss ($\frac1N\mathbf{X}^\top S\mathbf{X}$) are shown convex.
    PSD at a single point is not enough.
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 39, label: "02a slide 39 (annotated)"}
  added: 2026-10-11

- id: style-02a-momentum-variance
  type: mcq
  origin: exam_style
  lecture: "02a"
  themes: [sgd]
  priority: core
  front: |
    *(Momentum)* $\mathbf{m}_{t+1} = \beta\mathbf{m}_t + (1-\beta)\mathbf{g}_t$ with i.i.d. stochastic gradients of variance $\sigma^2$ (per coordinate).
    For $\beta = 0.9$, what is the variance of $\mathbf{m}_t$ in the limit $t \to \infty$?
  choices: ["$\\sigma^2/19$", "$\\sigma^2$", "$0.1\\,\\sigma^2$", "$0.01\\,\\sigma^2$"]
  answer: [0]
  explanation: |
    Unrolled, $\mathbf{m}_{t+1} = (1-\beta)\sum_{k} \beta^k \mathbf{g}_{t-k}$ (an exponential moving average). Independent terms ⇒
    $\operatorname{Var} = (1-\beta)^2\sigma^2\sum_k \beta^{2k} \to \frac{(1-\beta)^2}{1-\beta^2}\sigma^2 = \frac{1-\beta}{1+\beta}\sigma^2 = \frac{0.1}{1.9}\sigma^2$.
    $\sigma^2$ ignores the averaging; $0.1\sigma^2$ and $0.01\sigma^2$ forget the geometric sum. Momentum averages past gradients and so
    reduces the variance of the update (Final 2025 Q44, open question).
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization.pdf, page: 26, label: "02a slide 25"}
    - {kind: exam, pdf: exam/final-exam-2025-solutions.pdf, page: 18, label: "Final 2025 Q44"}
  added: 2026-10-11
  notes: "Result from the official solution of Final 2025 Q44 (p. 19): Var[m_t] → (1 − β)/(1 + β) Var[g]."

- id: style-02a-adam
  type: mcq
  origin: exam_style
  lecture: "02a"
  themes: [sgd]
  priority: core
  front: "*(Adam)* Which property distinguishes Adam from SGD with momentum?"
  choices:
    - "A coordinate-wise step size, dividing by a running average of squared gradients."
    - "It uses the Hessian, like Newton's method."
    - "It needs the full gradient at every step."
    - "It needs only one model-sized vector of memory."
  answer: [0]
  explanation: |
    02a slide 26: $w_i \leftarrow w_i - \gamma\, m_i/\sqrt{v_i}$ with $v_i$ a running average of $g_i^2$ — a momentum variant of Adagrad with a
    coordinate-wise adjusted learning rate. It is first-order (no Hessian) and stochastic, and it stores three model-sized vectors
    ($\mathbf{w}, \mathbf{m}, \mathbf{v}$). Adam is an optimizer, not a regularization technique (Final 2025 Q12).
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 27, label: "02a slide 26 (annotated)"}
  added: 2026-10-11
