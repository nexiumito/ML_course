# Lecture 01b — Regression (Jaggi deck). Written in S3 (2026-10-02); reworked 2026-10-11 (REWORK.md): exam-format tf/mcq only.
# Light lecture: officials in exams/01b.yaml cover correlation/causation and when linear regression "works"
# (2020 Q19, 2017 P18, 2016 Q1–Q2). Dropped: definitions, notation, prediction vs interpretation (never asked).

- id: style-01b-parameter-count
  type: mcq
  origin: exam_style
  lecture: "01b"
  themes: [linear-regression]
  priority: core
  front: "*(Linear regression)* A multivariate linear regression model with an offset term is fit on inputs $\\mathbf{x}_n \\in \\mathbb{R}^{D}$. How many parameters does it have?"
  choices: ["$D + 1$", "$D$", "$N$", "$N(D+1)$"]
  answer: [0]
  explanation: |
    One weight per input dimension plus the offset $w_0$: $D+1$ ($\tilde{\mathbf{w}} = (w_0, \dots, w_D)$). $D$ is the count without offset;
    the number of parameters does not depend on $N$.
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01b_regression_annotated.pdf, page: 12, label: "01b slide 11 (annotated)"}
  added: 2026-10-02

- id: style-01b-overparameterized-unique
  type: tf
  origin: exam_style
  lecture: "01b"
  themes: [linear-regression, overfitting]
  priority: core
  front: "*(Linear regression)* With $D > N$ (more parameters than examples) and no regularization, the best-fitting weight vector is uniquely determined by the data."
  answer: false
  explanation: |
    $D > N$ makes the problem under-determined: many weight vectors fit equally well (for $N = 1$ and $w_0 + w_1x$, every line through the point).
    Regularization (e.g. ridge) restores a unique solution.
  trap: "D > N ⇒ non-identifiable weights (XᵀX singular, lecture 03a)."
  sources:
    - {kind: lecture, pdf: lectures/01/lecture01b_regression_annotated.pdf, page: 14, label: "01b slide 19 (annotated)"}
  added: 2026-10-02


- id: style-01b-gradient-shape
  type: mcq
  origin: exam_style
  lecture: "01b"
  also_lectures: ["02a"]
  themes: [linear-regression, least-squares]
  priority: core
  front: "*(Dimensions)* $\\mathbf{X}$ is $N \\times D$ (row $n$ = $\\mathbf{x}_n^\\top$), $\\mathbf{w} \\in \\mathbb{R}^D$, $\\mathbf{y} \\in \\mathbb{R}^N$. What is the shape of $\\mathbf{X}^\\top(\\mathbf{y} - \\mathbf{X}\\mathbf{w})$?"
  choices: ["A vector in $\\mathbb{R}^D$", "A vector in $\\mathbb{R}^N$", "An $N \\times D$ matrix", "A scalar"]
  answer: [0]
  explanation: |
    $\mathbf{X}\mathbf{w} \in \mathbb{R}^N$, so the residual $\mathbf{e} = \mathbf{y} - \mathbf{X}\mathbf{w} \in \mathbb{R}^N$, and $\mathbf{X}^\top\mathbf{e}$ is
    $(D \times N)(N) = D$: one entry per weight, as a gradient must be ($\nabla\mathcal{L} = -\frac1N\mathbf{X}^\top\mathbf{e}$, 02a slide 15).
    $\mathbb{R}^N$ is the residual itself; a scalar would be $\mathbf{e}^\top\mathbf{e}$.
  trap: "A gradient always has the shape of w: check dimensions to eliminate options."
  sources:
    - {kind: lecture, pdf: lectures/02/lecture02a_optimization_annotated.pdf, page: 16, label: "02a slide 15 (annotated)"}
  added: 2026-10-11
